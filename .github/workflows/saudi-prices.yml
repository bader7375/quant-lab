name: Fetch Saudi prices
on:
  push:
    branches: [claude/nice-gates-8aa4yb]
    paths: [web/reversal-edge/data_update/request.txt]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch from Yahoo chart API
        run: python3 web/reversal-edge/data_update/fetch_yahoo.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/reversal-edge/data_update/yahoo web/reversal-edge/data_update/fetch_log.json
          git commit -m "Saudi price data from Yahoo ($(date -u +%F))" || exit 0
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
