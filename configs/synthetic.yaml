# Offline smoke-test config: no network needed.
# Verifies the pipeline recovers a known injected signal.
#   python -m quantlab.cli run --config configs/synthetic.yaml
data:
  provider: synthetic
  n_synthetic_tickers: 150
  synthetic_signal_strength: 3.0   # exaggerated on purpose; 1.0 is realistic
  start: "2010-01-01"
  end: "2022-01-01"
  min_dollar_volume: 1000000.0

label:
  threshold_sigma: 0.30
  vol_halflife: 21
  drop_neutral: true
  horizon: 1

split:
  n_folds: 5
  purge_days: 5
  embargo_days: 10
  inner_val_frac: 0.15
  min_train_days: 750
  expanding: true

model:
  kind: lightgbm
  calibration: sigmoid

backtest:
  cost_bps: 5.0

output_dir: artifacts/synthetic
