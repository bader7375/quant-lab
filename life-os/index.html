<title>LIFE OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..700&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: an instrument rail on the left, one calm reading column with a margin column beside it; on phones a thumb-reach tab bar. */
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --surface-2:#E3E9E6; --raised:#FFFFFF;
  --ink:#10191B; --ink-2:#3D4A48; --muted:#62706D; --line:#CBD4D0; --line-soft:#DCE3E0;
  --accent:#A26A0E; --accent-ink:#80530A; --accent-soft:rgba(162,106,14,.11); --on-accent:#FFFFFF;
  --good:#1D7F52; --warn:#B4531F; --crit:#B23434; --info:#2A6FC2;
  --good-soft:rgba(29,127,82,.11); --warn-soft:rgba(180,83,31,.11); --crit-soft:rgba(178,52,52,.10); --info-soft:rgba(42,111,194,.10);
  --d1:#2a78d6; --d2:#eb6834; --d3:#1baf7a; --d4:#eda100; --d5:#e87ba4; --d6:#008300; --d7:#6250d6; --d8:#e34948;
  --sky-a:#D7E3E6; --sky-b:#F1E6D2; --sun:#C98A1E;
  --shadow:0 1px 2px rgba(16,25,27,.05),0 12px 32px -18px rgba(16,25,27,.28);
  --scrim:rgba(10,16,18,.42);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --rail:212px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0A1012; --surface:#111A1D; --surface-2:#18242A; --raised:#152024;
  --ink:#E7EDEB; --ink-2:#B1BEBB; --muted:#83928F; --line:#26353B; --line-soft:#1C2A2F;
  --accent:#E2AE4E; --accent-ink:#EDC475; --accent-soft:rgba(226,174,78,.13); --on-accent:#1A1305;
  --good:#3DBB83; --warn:#EC835A; --crit:#E46A6A; --info:#5B9BEA;
  --good-soft:rgba(61,187,131,.13); --warn-soft:rgba(236,131,90,.13); --crit-soft:rgba(228,106,106,.13); --info-soft:rgba(91,155,234,.13);
  --d1:#3987e5; --d2:#d95926; --d3:#199e70; --d4:#c98500; --d5:#d55181; --d6:#008300; --d7:#9085e9; --d8:#e66767;
  --sky-a:#0C1820; --sky-b:#2B2316; --sun:#E8B455;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1012; --surface:#111A1D; --surface-2:#18242A; --raised:#152024;
  --ink:#E7EDEB; --ink-2:#B1BEBB; --muted:#83928F; --line:#26353B; --line-soft:#1C2A2F;
  --accent:#E2AE4E; --accent-ink:#EDC475; --accent-soft:rgba(226,174,78,.13); --on-accent:#1A1305;
  --good:#3DBB83; --warn:#EC835A; --crit:#E46A6A; --info:#5B9BEA;
  --good-soft:rgba(61,187,131,.13); --warn-soft:rgba(236,131,90,.13); --crit-soft:rgba(228,106,106,.13); --info-soft:rgba(91,155,234,.13);
  --d1:#3987e5; --d2:#d95926; --d3:#199e70; --d4:#c98500; --d5:#d55181; --d6:#008300; --d7:#9085e9; --d8:#e66767;
  --sky-a:#0C1820; --sky-b:#2B2316; --sun:#E8B455;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 16px 40px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-display);font-size:15px;line-height:1.5;font-optical-sizing:auto;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent-ink);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.num,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);font-size:12px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.eyebrow svg{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.read{font-family:var(--f-read);font-size:18px;line-height:1.6;color:var(--ink);max-width:66ch}
.read p+p,.read p+ul,.read ul+p,.read p+ol,.read ol+p{margin-top:.7em}
.read ul,.read ol{margin:.4em 0;padding-left:1.25em}
.read li+li{margin-top:.25em}
.read strong{font-weight:600}
.read code{font-family:var(--f-mono);font-size:.82em;background:var(--surface-2);padding:1px 5px;border-radius:4px}
.small{font-size:13px}
.tiny{font-size:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:6px;padding:22px 14px 18px;border-right:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand-mark{width:28px;height:28px;flex:none}
.brand-name{font-weight:700;letter-spacing:.06em;font-size:14px}
.brand-sub{font-family:var(--f-mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border:0;background:none;border-radius:8px;cursor:pointer;color:var(--ink-2);text-align:left;font-size:14px}
.nav button:hover{background:var(--surface-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-soft)}
.nav svg{width:18px;height:18px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:8px}
.status-line{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--crit)}

.main{min-width:0;padding-inline:clamp(16px,3.2vw,40px);padding-block:20px 64px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;max-width:1160px;margin:0 auto 18px}
.topbar .when{display:flex;flex-direction:column;gap:2px;min-width:0}
.topbar .when b{font-weight:600;font-size:15px}
.topbar .spacer{flex:1}
.view{max-width:1160px;margin:0 auto}

.tabbar{display:none}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-block:12px 104px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line-soft);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;color:var(--muted);font-size:11px;cursor:pointer;border-radius:8px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar button[aria-current="page"] svg{color:var(--accent)}
  .tabbar svg{width:22px;height:22px}
}

/* ---------- Primitives ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.gold{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.gold:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{min-height:30px;padding:4px 11px;font-size:13px}
.btn.danger{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.btn svg{width:16px;height:16px}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink);border-color:var(--ink-2)}
.icon-btn svg{width:18px;height:18px}

.update-btn{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:40px;padding:8px 16px 8px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft);color:var(--ink);cursor:pointer;font-weight:600;font-size:14px}
.update-btn:hover{background:color-mix(in srgb,var(--accent) 20%,transparent)}
.update-btn .ring{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent)}
.update-btn .ring svg{width:14px;height:14px}
.update-btn .stale{position:absolute;top:4px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--warn)}

.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;line-height:20px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.info{background:var(--info-soft);color:var(--info)}
.chip.gold{background:var(--accent-soft);color:var(--accent-ink)}
.chip.line{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.chip svg{width:12px;height:12px}
.dim-dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-l);padding:18px}
.card.flat{background:transparent;border-style:dashed}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3{font-size:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack.lg{gap:20px}
.stack.xl{gap:32px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.top{align-items:flex-start}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:32px;align-items:start}
@media (max-width:1080px){.cols{grid-template-columns:minmax(0,1fr)}}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
.hr{height:1px;background:var(--line-soft);border:0;margin:0}
.section-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.section-title h2{font-size:clamp(22px,2.4vw,28px);font-weight:600;letter-spacing:-.02em}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:12px;color:var(--muted);font-family:var(--f-mono);letter-spacing:.04em}
.input,.select,.textarea{width:100%;border:1px solid var(--line);background:var(--raised);border-radius:var(--r-m);padding:9px 11px;min-height:40px;outline:none;transition:border-color .15s}
.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.textarea{min-height:96px;resize:vertical;line-height:1.5}
.textarea.read-in{font-family:var(--f-read);font-size:17px}
input[type=range]{width:100%;accent-color:var(--accent)}
.seg{display:inline-flex;padding:3px;border-radius:999px;background:var(--surface-2);gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08),inset 0 0 0 1px var(--line-soft)}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:6px 0;cursor:pointer;font-size:13px}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:22px;border:1px dashed var(--line);border-radius:var(--r-l);color:var(--ink-2)}
.empty h3{font-size:16px;color:var(--ink)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-m);background:var(--surface-2);font-size:13px;color:var(--ink-2)}
.notice svg{width:16px;height:16px;flex:none;margin-top:2px}
.notice.warn{background:var(--warn-soft);color:var(--ink)}
.notice.warn svg{color:var(--warn)}
.notice.crit{background:var(--crit-soft);color:var(--ink)}
.notice.crit svg{color:var(--crit)}
.notice.info{background:var(--info-soft);color:var(--ink)}
.notice.info svg{color:var(--info)}
.notice.gold{background:var(--accent-soft);color:var(--ink)}
.notice.gold svg{color:var(--accent)}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-soft)}
.list>.item:first-child{border-top:0}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.skeleton{background:linear-gradient(90deg,var(--surface-2),var(--line-soft),var(--surface-2));background-size:200% 100%;animation:shimmer 1.4s linear infinite;border-radius:6px;min-height:14px}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:rot .8s linear infinite;flex:none}
@keyframes rot{to{transform:rotate(360deg)}}
details>summary{cursor:pointer;list-style:none}
details>summary::-webkit-details-marker{display:none}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* ---------- Today hero ---------- */
.hero{position:relative;overflow:hidden;border-radius:22px;padding:clamp(20px,3vw,34px);background:linear-gradient(170deg,var(--sky-a) 0%,var(--sky-b) 100%);border:1px solid var(--line-soft)}
.hero .horizon{position:absolute;left:0;bottom:0;width:100%;height:120px;pointer-events:none}
.hero-inner{position:relative;display:flex;flex-direction:column;gap:14px;max-width:760px}
.hero h1{font-size:clamp(30px,4.6vw,52px);line-height:1.04;letter-spacing:-.03em;font-weight:600;font-variation-settings:"opsz" 96}
.hero .why{font-family:var(--f-read);font-size:19px;line-height:1.5;color:var(--ink-2);max-width:60ch}
.hero .controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:6px}
@media (prefers-reduced-motion:no-preference){
  .anim .hero .sun{animation:rise 1.6s cubic-bezier(.2,.7,.2,1) both}
  @keyframes rise{from{transform:translateY(26px);opacity:.2}to{transform:none;opacity:1}}
  .anim .fade-in{animation:fade .5s ease both}
  @keyframes fade{from{opacity:.001;transform:translateY(4px)}to{opacity:1;transform:none}}
}

/* ---------- Briefing ---------- */
.brief{display:flex;flex-direction:column;gap:0}
.bsec{display:grid;grid-template-columns:120px minmax(0,1fr);gap:20px;padding:26px 0;border-top:1px solid var(--line-soft)}
.bsec:first-child{border-top:0}
.bsec .meta{display:flex;flex-direction:column;gap:8px;padding-top:3px}
.bsec h3{font-size:22px;letter-spacing:-.015em;margin-bottom:10px}
.bsec .task{margin-top:14px;padding:14px 16px;border-radius:var(--r-m);background:var(--surface);border:1px solid var(--line-soft)}
.bsec .task .eyebrow{color:var(--accent-ink);margin-bottom:6px}
@media (max-width:720px){.bsec{grid-template-columns:minmax(0,1fr);gap:8px}.bsec .meta{flex-direction:row;flex-wrap:wrap;align-items:center}}
.bigpic{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:720px){.bigpic{grid-template-columns:minmax(0,1fr)}}
.bigpic h4{font-size:12px;font-family:var(--f-mono);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-bottom:6px}
.bigpic ul{margin:0;padding-left:1.1em;font-family:var(--f-read);font-size:16px;line-height:1.5}
.final{border-radius:20px;padding:clamp(18px,3vw,28px);background:var(--ink);color:var(--bg);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.final .eyebrow{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.final p{font-family:var(--f-read);font-size:19px;line-height:1.4;margin-top:6px}
.final .n{font-family:var(--f-mono);font-size:12px;opacity:.7}
@media (max-width:860px){.final{grid-template-columns:minmax(0,1fr)}}
.challenge{border-left:3px solid var(--accent);padding:4px 0 4px 16px}
.challenge p{font-family:var(--f-read);font-style:italic;font-size:18px}

/* ---------- Wheel ---------- */
.wheel-wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:start}
@media (max-width:980px){.wheel-wrap{grid-template-columns:minmax(0,1fr)}}
.wheel-svg{width:100%;max-width:560px;height:auto;display:block;margin:0 auto;overflow:visible}
.wheel-svg .sector{cursor:pointer;outline:none}
.wheel-svg .sector:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.wheel-svg text{fill:var(--ink-2);font-family:var(--f-display)}
.dimlist{display:flex;flex-direction:column}
.dimrow{display:grid;grid-template-columns:14px minmax(0,1fr) 92px 64px;gap:10px;align-items:center;padding:9px 6px;border-radius:8px;cursor:pointer;border:0;background:none;text-align:left;width:100%}
.dimrow:hover{background:var(--surface-2)}
.dimrow[aria-pressed="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.dimrow .nm{font-weight:500;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dimrow .sc{font-family:var(--f-mono);font-size:13px;text-align:right}
.ladder{display:flex;flex-direction:column;gap:0;border-left:2px solid var(--line);margin-left:6px}
.rung{position:relative;padding:8px 0 10px 18px}
.rung::before{content:"";position:absolute;left:-6px;top:14px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--line)}
.rung.active::before{border-color:var(--accent);background:var(--accent)}
.rung.proposed::before{border-style:dashed}

/* ---------- Learn ---------- */
.flash{border-radius:20px;background:var(--surface);border:1px solid var(--line-soft);padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
.flash .prompt{font-family:var(--f-read);font-size:20px;line-height:1.55;max-width:64ch}
.reveal{margin-top:18px;padding-top:18px;border-top:1px solid var(--line-soft)}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.grades button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:12px;border:1px solid var(--line);background:var(--raised);cursor:pointer;font-weight:600}
.grades button small{font-family:var(--f-mono);font-weight:400;font-size:11px;color:var(--muted)}
.grades button:hover{border-color:var(--ink-2)}
.grades .again{color:var(--crit)} .grades .hard{color:var(--warn)} .grades .good{color:var(--good)} .grades .easy{color:var(--info)}
.conf{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.conf button{padding:8px 4px;border:1px solid var(--line);border-radius:10px;background:var(--raised);cursor:pointer;font-size:13px}
.conf button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.trackgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:980px){.trackgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.track{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--r-l);border:1px solid var(--line-soft);background:var(--surface);cursor:pointer;text-align:left}
.track:hover{border-color:var(--line)}
.track[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--accent)}
.track .big{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1}
.retention{display:flex;gap:2px;height:22px;align-items:flex-end}
.retention i{flex:1;border-radius:2px 2px 0 0;background:var(--accent);min-height:2px}
.constellation{width:100%;height:auto;display:block;background:radial-gradient(ellipse at center,var(--surface) 0%,var(--bg) 75%);border-radius:var(--r-l);border:1px solid var(--line-soft)}
.criteria{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;font-size:14px}

/* ---------- Library ---------- */
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.lib{display:flex;flex-direction:column;gap:10px;padding:18px;border-radius:var(--r-l);background:var(--surface);border:1px solid var(--line-soft)}
.lib h3{font-family:var(--f-read);font-weight:500;font-size:20px;line-height:1.25;letter-spacing:-.005em}
.lib .finding{font-family:var(--f-read);font-size:16px;line-height:1.5;color:var(--ink-2)}
.lib .foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:8px;border-top:1px solid var(--line-soft)}
.toggle{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px;background:transparent;cursor:pointer;color:var(--ink-2)}
.toggle[aria-pressed="true"]{background:var(--good-soft);border-color:transparent;color:var(--good)}
.toggle svg{width:12px;height:12px}

/* ---------- Sheets, toasts ---------- */
.sheet-back{position:fixed;inset:0;background:var(--scrim);z-index:50;display:flex;align-items:center;justify-content:center;padding:24px}
.sheet{width:min(860px,100%);max-height:calc(100dvh - 48px);overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.sheet.wide{width:min(1060px,100%)}
.sheet-h{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;padding:16px 20px;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-soft)}
.sheet-h h2{font-size:18px}
.sheet-b{padding:20px;display:flex;flex-direction:column;gap:18px}
@media (max-width:720px){.sheet-back{padding:0;align-items:flex-end}.sheet{max-height:94dvh;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}}
.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(520px,calc(100% - 32px))}
.toast{pointer-events:auto;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);max-width:100%}
.toast.err{background:var(--crit);color:#fff}
@media (max-width:860px){.toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}}
.steps{display:flex;flex-direction:column;gap:0;counter-reset:s}
.step{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line-soft)}
.step:first-child{border-top:0}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);color:var(--muted)}
.step.done .n{background:var(--good);border-color:var(--good);color:#fff}
.step.run .n{border-color:var(--accent);color:var(--accent-ink)}
.step.fail .n{background:var(--crit);border-color:var(--crit);color:#fff}
.step.skip .n{border-style:dashed}
.step h4{font-size:14px}
.step p{font-size:13px;color:var(--ink-2)}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:12px 14px;border-radius:14px;font-size:15px;line-height:1.55}
.msg.me{align-self:flex-end;background:var(--ink);color:var(--bg);border-bottom-right-radius:4px;white-space:pre-wrap}
.msg.ai{align-self:flex-start;background:var(--surface);border:1px solid var(--line-soft);border-bottom-left-radius:4px;font-family:var(--f-read);font-size:17px}
.tooltip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:260px;box-shadow:var(--shadow)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:2px;border-radius:2px;display:inline-block}
.hov:hover{fill-opacity:.06}
.wheel-svg .sector:hover .hit{fill-opacity:.85}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

'use strict';
/* =====================================================================
   LIFE OS — personal intelligence system
   Storage: the artifact's private per-user database (claude.use("db")),
            under data/users/<your id>/ — private even from shared viewers.
   Reasoning: Claude through claude.use("sample"), on your own Claude
            account. No API key exists anywhere in this page.

const VERSION = '1.0.0';
const SCHEMA = 1;

const DIMS = [
  {k:'growth',  n:'Personal Growth',  s:'Growth',  c:'--d1', sub:['Communication','Confidence & presence','Discipline & focus','Thinking & decisions','Emotional regulation']},
  {k:'health',  n:'Health',           s:'Health',  c:'--d2', sub:['Fitness','Sleep','Nutrition','Cognitive performance']},

  {k:'fun',     n:'Fun & Recreation', s:'Fun',     c:'--d5', sub:['Play','Creativity','Exploration','Rest']},
  {k:'spirit',  n:'Spirituality',     s:'Spirit',  c:'--d6', sub:['Practice','Reflection','Gratitude','Values']},
  {k:'career',  n:'Career',           s:'Career',  c:'--d7', sub:['Clinical mastery','Medication safety','Leadership','Automation & AI tools']},
  {k:'finance', n:'Finance',          s:'Finance', c:'--d8', sub:['Savings & goals','Market understanding','Quant research','Risk discipline']},
];
const DIM = Object.fromEntries(DIMS.map(d => [d.k, d]));
const TRACKS = [
  {k:'pharm', n:'Clinical pharmacy',       s:'Pharmacy', dim:'career'},
  {k:'quant', n:'Quant & markets',         s:'Quant',    dim:'finance'},
  {k:'comm',  n:'Communication & growth',  s:'Growth',   dim:'growth'},
  {k:'mind',  n:'Health & cognition',      s:'Mind',     dim:'health'},
];
const TRACK = Object.fromEntries(TRACKS.map(t => [t.k, t]));
const DIM_STATUS = {
  improve: {n:'Needs improvement', cls:'warn'},
  well:    {n:'Doing well',        cls:'good'},
  maintain:{n:'Maintain',          cls:'info'},
  priority:{n:'Temporary priority',cls:'gold'},
  vanity:  {n:'Check the metric',  cls:'line'},
};
const HORIZONS = [
  {k:'outcome',   n:'Long-term outcome'},
  {k:'annual',    n:'Annual objective'},
  {k:'quarterly', n:'Quarterly milestone'},
  {k:'monthly',   n:'Monthly priority'},
  {k:'weekly',    n:'Weekly experiment'},
  {k:'daily',     n:'Daily action'},
];
const MEM_CATS = [
  {k:'stable',    n:'Stable preferences'},
  {k:'goals',     n:'Long-term goals'},
  {k:'projects',  n:'Active projects'},
  {k:'interests', n:'Current interests'},
  {k:'learning',  n:'Learning history'},
  {k:'decisions', n:'Important decisions'},
  {k:'temporary', n:'Temporary circumstances'},
  {k:'archived',  n:'Archived'},
];
const MEM_KINDS = {fact:'Fact', preference:'Preference', observation:'Observation', hypothesis:'Hypothesis'};
const MEM_SOURCES = {you:'You told LIFE OS', import:'Imported', claude:'Inferred by Claude', seen:'Seen in your files'};
const LIB_CATS = [
  {k:'breaking',   n:'Time-sensitive'},
  {k:'research',   n:'Important research'},
  {k:'evergreen',  n:'Evergreen'},
  {k:'disputed',   n:'Disputed or preliminary'},
  {k:'opportunity',n:'Practical opportunity'},
  {k:'experiment', n:'Worth experimenting with'},
];
const LIB_TOPICS = {pharm:'Clinical pharmacy', quant:'Quant & markets', learning:'Learning science', mind:'Health & cognition', comm:'Behaviour & communication', ai:'AI & automation'};
const EVIDENCE = {
  guideline:'Clinical guideline', regulatory:'Regulatory notice', review:'Systematic review / meta-analysis',
  rct:'Randomised trial', observational:'Observational study', consensus:'Expert consensus',
  paper:'Peer-reviewed paper', official:'Official data / rules', secondary:'Secondary report', model:'Model knowledge (unverified)'
};
const CONF = [
  {k:1, n:'Guessing',    p:.25},
  {k:2, n:'Unsure',      p:.5},
  {k:3, n:'Fairly sure', p:.75},
  {k:4, n:'Certain',     p:.95},
];
const MODES = {
  quick:    {n:'Quick',    m:'3–5 min',   sections:'2 sections, very short'},
  standard: {n:'Standard', m:'10–15 min', sections:'4–5 sections'},
  deep:     {n:'Deep',     m:'20–30 min', sections:'5–7 sections with one longer case or paper'},
};
const DEFAULT_SETTINGS = {
  v: SCHEMA,
  deepModel: 'claude-opus-5-5',
  deepEffort: 'high',
  routineTier: 'default',
  briefMode: 'standard',
  newPerDay: 6,
  sessionSize: 12,
  privacy: {relationships:false, financeNumbers:false, health:true, journal:true},
};

/* ---------------- tiny utilities ---------------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const icon = (n, cls = '') => `<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const plural = (n, w, pw) => `${n} ${n === 1 ? w : (pw || w + 's')}`;
const norm = s => String(s || '').toLowerCase().replace(/[^a-z0-9؀-ۿ]+/g, ' ').trim();
function hash(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193); } return (h >>> 0).toString(36); }
function jaccard(a, b) { const A = new Set(norm(a).split(' ').filter(w => w.length > 2)), B = new Set(norm(b).split(' ').filter(w => w.length > 2)); if (!A.size || !B.size) return 0; let i = 0; A.forEach(w => { if (B.has(w)) i++; }); return i / (A.size + B.size - i); }
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : NaN;
const sd = a => { if (a.length < 2) return NaN; const m = mean(a); return Math.sqrt(a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1)); };
const fmt1 = v => Number.isFinite(v) ? (Math.round(v * 10) / 10).toString() : '–';
const pct = v => Number.isFinite(v) ? Math.round(v * 100) + '%' : '–';

const dayKey = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = k => { const [y, m, d] = String(k).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (k, n) => { const d = parseDay(k); d.setDate(d.getDate() + n); return dayKey(d); };
const daysBetween = (a, b) => Math.round((parseDay(b) - parseDay(a)) / 864e5);
function isoWeek(d = new Date()) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return `${t.getUTCFullYear()}-W${pad(Math.ceil(((t - y0) / 864e5 + 1) / 7))}`;
}
const fmtDate = (d, o = {weekday:'long', day:'numeric', month:'long'}) => { try { return new Intl.DateTimeFormat('en-GB', o).format(d); } catch { return d.toDateString(); } };

function wheelSVG(rows, {mini = false, sel = null} = {}) {
  const R = 150, r0 = mini ? 20 : 26, n = DIMS.length, step = 2 * Math.PI / n, gap = 0.014;

/* Knowledge constellation: concepts as stars, tracks as clusters, shared ideas as links. */
function constellationData() {
  const nodes = {}, links = [];
  activeCards().forEach(c => {
    const k = norm(c.concept || c.prompt.slice(0, 40)); if (!k) return;
    const n = nodes[k] ||= {k, label: c.concept || '', track: c.track, imp: 0, rs: [], lapses: 0, cards: 0, related: new Set()};
    n.imp = Math.max(n.imp, c.importance || 2); n.cards++;

    n.lapses += (c.srs && c.srs.lapses) || 0;
    (c.related || []).forEach(x => n.related.add(norm(x)));
  });

  list.forEach(n => n.related.forEach(rk => { const m = nodes[rk]; if (!m || m === n) return; const key = [n.k, m.k].sort().join('|'); if (seen.has(key)) return; seen.add(key); links.push({a: n, b: m, cross: n.track !== m.track}); }));
  return {list, links};
}

  TRACKS.forEach(t => { const [qx, qy] = Q[t.k]; s += `<text x="${qx ? W0 - 20 : 20}" y="${qy ? H - 14 : 24}" text-anchor="${qx ? 'end' : 'start'}" font-size="11" style="font-family:var(--f-mono);letter-spacing:.08em" fill="var(--muted)">${esc(t.n.toUpperCase())}</text>`; });

  });
  return `<svg class="constellation" viewBox="0 0 ${W0} ${H}" role="img" aria-label="Knowledge constellation">${s}</svg>`;
}

function briefPrompt(mode, energy) {

  return `You are LIFE OS, the private personal intelligence system of one person. Write today's morning briefing for them to read with coffee.

TODAY: ${todayLine()}
TIME AVAILABLE: ${m.n} mode, ${m.m} in total → ${m.sections}.
ENERGY TODAY: ${energy === 'low' ? 'low — choose fewer, smaller, gentler tasks' : energy === 'high' ? 'sharp — one demanding task is welcome' : 'steady'}.

RULES
- Do the thinking first. Be concise, concrete and candid. No generic motivation, no flattery, no filler.
- Use only facts present in DATA. Never invent personal facts, events, numbers, papers, dates, alerts or quotations. If data is thin, say so in data_gaps.
- Separate established evidence from preliminary findings, and label model knowledge that is not backed by a library source as "model-knowledge".
- Career section: if the VERIFIED LIBRARY holds an important, recent clinical item that is unread, prioritise it and put its id in source_ids. Otherwise teach one valuable concept or revisit a weak concept (use the card ids below). Never present a library item as new if it is old. Educational only: no patient-specific orders; say when current guidance or local protocol must be checked.
- Finance section: education and research method, not personal advice. Never call a strategy profitable without out-of-sample, cost-aware validation.
- Health and cognition: no promises of general intelligence gains. Prefer demonstrated benefits.
- Do not force every life dimension into today. Choose by need, using the wheel, goals, check-ins and neglected areas. Sometimes the right advice is to maintain, rest or simplify.
- Each section needs an exact task (what to do, for how long, how to know it is done). Sum of minutes must fit the time available.
- "challenge": one candid observation that the data supports (a gap between stated priorities and behaviour, overconfidence, too many goals). Null if the data does not support one.
- Write the body in short paragraphs; markdown lists and **bold** are allowed.

LINKED CARD IDS you may use (due or recently missed): ${ids.map(x => `${x.c.id} (${x.c.track}: ${x.c.concept})`).join('; ') || 'none'}

Return ONLY one JSON object with this shape:
{"theme":{"title":"≤8 words","why":"2–3 sentences grounded in the data"},

 "final":{"one_thing":"…","smallest_action":"…","measure":"…"},

DATA
${digest()}`;

function nextLearnSignals(tr) {

}

/* =====================================================================

function libAgeFlag(l) {
  if (!l.published) return null;
  const age = daysBetween(l.published.length === 7 ? l.published + '-01' : l.published.length === 4 ? l.published + '-01-01' : l.published, dayKey());
  if (l.category === 'breaking' && age > 120) return 'Time-sensitive item older than four months: recheck for updates or corrections.';
  if ((l.evidence === 'guideline' || l.evidence === 'regulatory') && age > 365 * 3) return 'Guidance older than three years: check whether it has been superseded.';
  return null;
}
function viewLibrary() {
  const cat = S.ui.libCat, topic = S.ui.libTopic, show = S.ui.libShow;
  const list = S.data.library.filter(l => (cat === 'all' || l.category === cat) && (topic === 'all' || l.topic === topic) && (show === 'all' || (show === 'unread' ? !l.read : show === 'unapplied' ? l.read && !l.applied : true)))
    .sort((a, b) => (a.read ? 1 : 0) - (b.read ? 1 : 0) || (b.published || '').localeCompare(a.published || ''));
  const queued = S.data.queue.filter(q => q.status !== 'done');
  let h = `<div class="stack xl">
    <div class="section-title"><h2>Research library</h2><span class="chip line">${S.data.library.length} sources · ${S.data.library.filter(l => !l.read).length} unread</span><div style="flex:1"></div>
      <button class="btn" data-act="sheet" data-id="research-req">${icon('plus')}Request research</button></div>
    <div class="row" style="gap:12px">
      <div class="seg">${[['all', 'All'], ...LIB_CATS.map(c => [c.k, c.n])].map(([k, n]) => `<button data-act="lib-cat" data-id="${k}" aria-pressed="${cat === k}">${esc(n)}</button>`).join('')}</div>
      <select class="select" style="width:auto" id="lib-topic" data-act-change="lib-topic"><option value="all">All topics</option>${Object.entries(LIB_TOPICS).map(([k, n]) => `<option value="${k}" ${topic === k ? 'selected' : ''}>${n}</option>`).join('')}</select>
      <div class="seg">${[['all', 'Everything'], ['unread', 'Unread'], ['unapplied', 'Read, not applied']].map(([k, n]) => `<button data-act="lib-show" data-id="${k}" aria-pressed="${show === k}">${n}</button>`).join('')}</div>
    </div>`;
  if (queued.length) h += `<div class="notice">${icon('info')}<div class="stack" style="gap:6px"><b>${plural(queued.length, 'research request')} waiting</b>${queued.map(q => `<span class="small">• ${esc(q.question)} <span class="muted">(${esc(LIB_TOPICS[q.topic] || q.topic)}, asked ${esc(fmtShort(dayKey(new Date(q.created))))})</span> <button class="btn quiet sm" data-act="queue-del" data-id="${q.id}">Remove</button></span>`).join('')}
    <span class="tiny muted">Web research runs in Claude Code, which can search and verify sources; this page cannot browse. In Claude Code, say: “Run the LIFE OS research queue.”</span></div></div>`;
  if (!list.length) h += `<div class="empty"><h3>${S.data.library.length ? 'Nothing matches these filters' : 'The library is empty'}</h3><p class="small">${S.data.library.length ? 'Change a filter above.' : 'Sources arrive from verified research runs. Request a topic and run the research queue in Claude Code.'}</p></div>`;
  else h += `<div class="libgrid">${list.map(libCard).join('')}</div>`;
  return h + '</div>';
}

function parseExport(name, raw) {
  const convs = [];
  const push = (title, date, parts) => { const text = parts.filter(Boolean).join('\n---\n').trim(); if (text) convs.push({title, date, text, sel: false}); };
  let data = null;
  if (/\.json$/i.test(name) || /^\s*[[{]/.test(raw)) { try { data = JSON.parse(raw); } catch { data = null; } }
  if (Array.isArray(data)) {
    data.forEach(c => {
      if (c && c.mapping) {
        const msgs = Object.values(c.mapping).map(n => n && n.message).filter(m => m && m.author && m.author.role === 'user' && m.content && Array.isArray(m.content.parts));
        msgs.sort((a, b) => (a.create_time || 0) - (b.create_time || 0));
        push(c.title, c.create_time ? dayKey(new Date(c.create_time * 1000)) : '', msgs.map(m => m.content.parts.filter(p => typeof p === 'string').join(' ')));
      } else if (c && Array.isArray(c.chat_messages)) {
        const msgs = c.chat_messages.filter(m => m && m.sender === 'human');
        push(c.name, c.created_at ? String(c.created_at).slice(0, 10) : '', msgs.map(m => m.text || (Array.isArray(m.content) ? m.content.filter(x => x && x.type === 'text').map(x => x.text).join(' ') : '')));
      } else if (c && c.role && c.content) {
        if (c.role === 'user') push('Conversation', '', [String(c.content)]);
      }
    });
  }
  if (!convs.length) {
    const chunks = raw.split(/\n(?=#{1,2}\s)|\n{3,}/).map(s => s.trim()).filter(Boolean);
    (chunks.length ? chunks : [raw]).forEach((t, i) => push(t.split('\n')[0].replace(/^#+\s*/, '').slice(0, 80) || `${name} part ${i + 1}`, '', [t]));
  }
  convs.sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return convs;
}
async function runImport() {
  const im = S.ui.imp; if (!im || im.busy) return;
  const sel = im.convs.filter(c => c.sel); if (!sel.length) return;
  const batches = []; let cur = '';
  sel.forEach(c => { const block = `### ${c.title || 'Untitled'} (${c.date || 'undated'})\n${c.text.slice(0, 20000)}\n`; if (cur.length + block.length > 60000 && cur) { batches.push(cur); cur = ''; } cur += block; });
  if (cur) batches.push(cur);
  const existing = S.data.memory.filter(m => m.status !== 'rejected').map(m => `${m.id} | ${m.text}`).slice(0, 120).join('\n');
  let added = 0, dup = 0;
  try {
    for (let i = 0; i < batches.length; i++) {
      im.busy = `Reading batch ${i + 1} of ${batches.length}…`; schedule();
      const arr = await ask(`Extract durable personal memory for LIFE OS from these excerpts. They are the person's OWN messages from exported AI conversations.
Keep only what will improve future decisions, learning or personalisation: stable preferences, long-term goals, active projects, current interests, learning history, important decisions, temporary circumstances. Skip trivia, one-off tasks, and anything about other people beyond what is needed. Never extract patient information, credentials or account numbers.
Mark anything you infer (rather than read directly) as kind "hypothesis" with confidence "low" or "medium". Do not turn one remark into a personality judgement.
If an item duplicates EXISTING MEMORY, set duplicate_of to that id; if it contradicts one, set conflicts_with.
EXISTING MEMORY (id | text):
${existing || 'none'}

EXCERPTS:
${batches[i]}

Return ONLY a JSON array: [{"category":"stable|goals|projects|interests|learning|decisions|temporary","kind":"fact|preference|observation|hypothesis","text":"one sentence, third person","dimension":"growth|health|family|love|fun|spirit|career|finance|null","confidence":"low|medium|high","evidence":"quote ≤ 20 words","source_title":"…","source_date":"YYYY-MM-DD or null","duplicate_of":"id or null","conflicts_with":"id or null"}]`, {deep: false, label: 'import'});
      if (!Array.isArray(arr)) continue;
      for (const x of arr) {
        if (!x || !x.text) continue;
        if (x.duplicate_of || S.data.memory.some(m => jaccard(m.text, x.text) > .75)) { dup++; continue; }
        await save('memory', {id: 'm-' + hash(norm(x.text)), text: String(x.text).slice(0, 400), category: MEM_CATS.some(c => c.k === x.category) ? x.category : 'interests', kind: MEM_KINDS[x.kind] ? x.kind : 'hypothesis', dim: DIM[x.dimension] ? x.dimension : null, confidence: x.confidence || 'medium', evidence: x.evidence ? String(x.evidence).slice(0, 200) : '', sourceTitle: x.source_title || im.name, date: x.source_date || dayKey(), source: 'import', status: 'pending', conflict: x.conflicts_with || null});
        added++;
      }
    }
    im.result = `${plural(added, 'memory', 'memories')} proposed${dup ? `, ${dup} duplicate${dup > 1 ? 's' : ''} skipped` : ''}.`;
    logChange('import', `Imported from ${im.name}: ${added} proposed`, {});
  } catch (e) { toast(aiErrCopy(e), true); }
  finally { im.busy = null; schedule(); }
}

const PERIODS = {
  week:    {n:'Week',    q:['What actually got done that mattered?','Where did intention and action diverge, and what got in the way?','What did you learn that changed a decision or a skill?','What will you keep, change, and drop next week?']},
  month:   {n:'Month',   q:['Which outcomes moved, not just activities?','Which area did you neglect, and was that a choice?','Which experiment taught you the most?','What is the one priority for next month?']},
  quarter: {n:'Quarter', q:['Which quarterly milestones were met, missed, or abandoned — and why?','What should become a habit, and what should stop entirely?','Which goals conflict with each other?','What are the three priorities for next quarter?']},
  year:    {n:'Year',    q:['What did you learn this year that you will still use in five years?','What are you proud of? What do you regret?','Who did you invest in, and who invested in you?','What kind of year do you want next, in one sentence?']},
};
function periodKey(t, d = new Date()) {
  if (t === 'week') return 'w-' + isoWeek(d);
  if (t === 'month') return 'm-' + dayKey(d).slice(0, 7);
  if (t === 'quarter') return `q-${d.getFullYear()}-Q${Math.floor(d.getMonth() / 3) + 1}`;
  return 'y-' + d.getFullYear();
}
function periodDays(t) { return {week: 7, month: 30, quarter: 91, year: 365}[t]; }
function periodStats(t) {
  const n = periodDays(t), today = dayKey(), from = addDays(today, -n + 1);
  const ck = S.data.checkins.filter(c => c.date >= from && c.date <= today);
  const logs = allLogs().filter(l => l.t >= parseDay(from).getTime());
  const acc = logs.length ? logs.reduce((s, l) => s + (l.ok ? 1 : l.partial ? .5 : 0), 0) / logs.length : NaN;
  const ot = ck.filter(c => c.oneThing && c.oneThing !== 'none');
  const otRate = ot.length ? ot.reduce((s, c) => s + (c.oneThing === 'yes' ? 1 : c.oneThing === 'partly' ? .5 : 0), 0) / ot.length : NaN;
  return {n, ck: ck.length, energy: mean(ck.map(c => c.energy).filter(Number.isFinite)), mood: mean(ck.map(c => c.mood).filter(Number.isFinite)), focus: ck.reduce((s, c) => s + (+c.focus || 0), 0), answers: logs.length, acc, otRate, otN: ot.length,
    goalsDone: S.data.goals.filter(g => g.status === 'done' && (g.updated || 0) >= parseDay(from).getTime()).length,
    exps: S.data.experiments.filter(e => e.status === 'running').length, libRead: S.data.library.filter(l => l.read && (l.updated || 0) >= parseDay(from).getTime()).length};
}

async function restoreBackup(file) {
  let obj; try { obj = JSON.parse(await file.text()); } catch { toast('That file is not valid JSON.', true); return; }
  if (!obj || obj.app !== 'LIFE OS' || !obj.collections) { toast('That file is not a LIFE OS backup.', true); return; }
  let added = 0, replaced = 0, kept = 0;
  S.ui.open.restore = 'Restoring…'; schedule();
  try {
    if (obj.profile && (!S.data.profile || (obj.profile.updated || 0) > (S.data.profile.updated || 0))) { await saveDoc('profile', obj.profile); replaced++; }
    if (obj.settings && !S.data.settings) await saveDoc('settings', obj.settings);
    for (const c of COLS) {
      for (const d of (obj.collections[c] || [])) {
        if (!d || !d.id || !/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(d.id)) continue;
        const cur = byId(c, d.id);
        if (!cur) { await dbWrite(`${colPath(c)}/${d.id}`, ref => ref.set(clone(d))); added++; }
        else if ((d.updated || 0) > (cur.updated || 0)) { await dbWrite(`${colPath(c)}/${d.id}`, ref => ref.set(clone(d))); replaced++; }
        else kept++;
      }
      S.ui.open.restore = `Restoring… ${added + replaced + kept} records checked`; schedule();
    }
    S.ui.open.restore = `Restore complete: ${added} added, ${replaced} replaced with newer versions, ${kept} already up to date.`;
    logChange('restore', S.ui.open.restore, {});
  } catch (e) { S.ui.open.restore = 'Restore stopped: ' + dbErrCopy(e); }
  schedule();
}
async function deleteAll() {

const UPDATE_STEPS = [
  ['retrieve',   'Retrieve',     'Gather goals, memory, check-ins, learning records, experiments, decisions and the library.'],
  ['reflect',    'Reflect',      'Compare recent behaviour with stated goals; look for repeated patterns, with evidence.'],
  ['research',   'Research',     'Choose the most relevant verified sources; queue new questions for a web-research run.'],
  ['verify',     'Verify',       'Check publication dates, evidence type and anything that needs rechecking.'],
  ['synthesize', 'Synthesize',   'What is genuinely new, what changes your understanding, what to do differently.'],
  ['model',      'Update model', 'Propose changes to goals, hypotheses and memory. Nothing is rewritten silently.'],
  ['actions',    'Next actions', 'Add lessons, propose experiments, and point tomorrow’s briefing at what matters.'],
  ['report',     'Report',       'Save a timestamped report with its sources.'],
];
function fingerprint() {
  const parts = [];
  S.data.checkins.forEach(c => parts.push('c' + c.date + (c.updated || 0)));
  S.data.cards.forEach(c => { const l = c.log || []; if (l.length) parts.push('k' + c.id + l.length + l[l.length - 1].t); });
  S.data.goals.filter(g => g.status !== 'proposed').forEach(g => parts.push('g' + g.id + g.status + (g.updated || 0)));
  S.data.memory.filter(m => m.status === 'approved').forEach(m => parts.push('m' + m.id + (m.updated || 0)));
  S.data.experiments.filter(e => e.status !== 'proposed').forEach(e => parts.push('e' + e.id + e.status + (e.logs || []).length));
  S.data.decisions.forEach(d => parts.push('d' + d.id + (d.updated || 0)));
  S.data.library.forEach(l => parts.push('l' + l.id + (l.updated || 0)));
  S.data.wheel.forEach(w => parts.push('w' + w.id + (w.updated || 0)));
  S.data.reviews.forEach(r => parts.push('r' + r.id + (r.updated || 0)));
  parts.push('p' + ((S.data.profile || {}).updated || 0));
  return hash(parts.sort().join('|'));
}
function setStep(k, st, note) { const u = S.ui.update; if (!u) return; u.steps[k] = {st, note: note || (u.steps[k] && u.steps[k].note) || ''}; schedule(); }
function pickSources(reflection) {
  const pri = new Set((profile().priorities || []));
  const topicDim = {pharm: 'career', quant: 'finance', learning: 'growth', mind: 'health', comm: 'growth', ai: 'career'};
  const words = norm(JSON.stringify(reflection || {})).split(' ').filter(w => w.length > 4);
  const wset = new Set(words);
  return S.data.library.map(l => {
    let s = 0;
    if (!l.read) s += 2; if (l.read && !l.applied) s += 1;
    if (pri.has(topicDim[l.topic])) s += 1.5;
    if (l.category === 'breaking') s += 1.5; if (l.category === 'research') s += 1;
    const age = l.published ? daysBetween(l.published.length === 10 ? l.published : (l.published + '-01-01').slice(0, 10), dayKey()) : 999;
    if (age < 120) s += 1.2;
    s += norm(l.title + ' ' + l.finding).split(' ').filter(w => wset.has(w)).length * .15;
    return {l, s};
  }).sort((a, b) => b.s - a.s).slice(0, 8).map(x => x.l);
}
async function runUpdate(force = false) {
  if (S.ui.update && S.ui.update.running) return;

  if (!S.cap.sample) { toast('Claude is not available in this view.', true); return; }
  const ctl = new AbortController();
  const u = S.ui.update = {running: true, steps: {}, report: null, error: null, id: 'u-' + Date.now(), ctl, t: Date.now()};
  UPDATE_STEPS.forEach(([k]) => { u.steps[k] = {st: 'pending', note: ''}; });

TODAY: ${todayLine()}
Compare recent activity with stated goals and priorities. Identify progress, repeated obstacles, new interests, changing priorities, and unresolved questions.

Return ONLY JSON: {"progress":[{"dimension":"…","text":"…","evidence":"…"}],"obstacles":[{"text":"…","evidence":"…","times_seen":0}],"new_interests":["…"],"priority_shifts":["…"],"patterns":[{"observation":"…","evidence":"…","hypothesis":"…","experiment":"…","dimension":"…","confidence":"low|medium|high"}],"balance":{"neglected":["dimension keys"],"overinvested":["dimension keys"],"note":"…"},"classification":[{"dimension":"key","status":"improve|well|maintain|priority|vanity","why":"…"}],"simplify":"… or null","unresolved_questions":["…"],"research_questions":[{"topic":"…","question":"…","why":"…"}]}

DATA
${digest()}`, {deep: true, signal: ctl.signal, label: 'update · reflect'});

    setStep('reflect', 'done', `${plural((refl.progress || []).length, 'sign')} of progress, ${plural((refl.obstacles || []).length, 'obstacle')}, ${plural((refl.patterns || []).length, 'possible pattern')}.`);

    /* 3 RESEARCH */
    cur = 'research'; setStep('research', 'run');
    const picked = pickSources(refl);
    let queued = 0;
    for (const q of (refl.research_questions || []).slice(0, 3)) {
      if (!q || !q.question) continue;
      if (S.data.queue.some(x => x.status !== 'done' && jaccard(x.question, q.question) > .5)) continue;
      await save('queue', {id: 'q-' + hash(norm(q.question)), question: String(q.question).slice(0, 300), topic: LIB_TOPICS[q.topic] ? q.topic : 'pharm', why: q.why || '', status: 'queued', origin: 'update', created: Date.now()});

function bindEvents() {
  document.addEventListener('click', ev => {
    const el = ev.target.closest && ev.target.closest('[data-act]'); if (!el) return;
    if (el.tagName === 'INPUT' && el.type === 'file') return;
    const fn = ACT[el.dataset.act]; if (!fn) return;
    if (el.tagName === 'A') return;
    if (el.dataset.act !== 'imp-sel') ev.preventDefault();
    hideTip();
    try { const r = fn(el, ev); if (r && r.catch) r.catch(e => { if (e && e.code && !['unavailable'].includes(e.code)) console.warn(e); }); } catch (e) { console.error(e); toast('Something went wrong: ' + (e && e.message), true); }
  });
  document.addEventListener('keydown', ev => {
    if (ev.key === 'Escape' && S.ui.sheet) { S.ui.sheet = null; schedule(); return; }
    const t = ev.target;
    if ((ev.key === 'Enter' || ev.key === ' ') && t && t.getAttribute && t.getAttribute('data-act') && !/^(BUTTON|INPUT|TEXTAREA|SELECT|A)$/.test(t.tagName)) { ev.preventDefault(); t.dispatchEvent(new MouseEvent('click', {bubbles: true})); }
    if (t && t.id === 'coach-in' && ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); S.ui.drafts['coach.msg'] = t.value; coachSend(t.value); }
  });
  document.addEventListener('input', ev => {
    const t = ev.target; if (!t || !t.dataset) return;
    if (t.dataset.draft) { S.ui.drafts[t.dataset.draft] = t.value; $$(`[data-mirror="${CSS.escape(t.dataset.draft)}"]`).forEach(m => { m.textContent = t.value; }); if (t.type === 'range') { const lbl = t.closest('label'); const b = lbl && lbl.querySelector('b.mono'); if (b) b.textContent = t.value + '%'; } }
    if (t.dataset.wheel) {
      const d = ensureWheelDraft(); d[t.dataset.id][t.dataset.wheel] = +t.value;
      const lab = $('#wv-' + t.dataset.wheel + '-' + t.dataset.id); if (lab) lab.textContent = t.value;
      const box = $('#wheelBox'); if (box) box.innerHTML = wheelSVG(wheelWorking(), {sel: S.ui.selDim});
    }
    if (t.dataset.wheelnote) { ensureWheelDraft()[t.dataset.wheelnote].note = t.value; }
  });
  document.addEventListener('change', ev => {
    const t = ev.target; if (!t) return;
    if (t.dataset && t.dataset.wheel) schedule();
    if (t.dataset && t.dataset.setting) setSetting(t.dataset.setting, t.value);
    if (t.dataset && t.dataset.privacy) setPrivacy(t.dataset.privacy, t.checked);
    if (t.dataset && t.dataset.actChange === 'lib-topic') { S.ui.libTopic = t.value; schedule(); }
    if (t.id === 'imp-file' && t.files && t.files[0]) {
      const f = t.files[0];
      if (f.size > 120 * 1024 * 1024) { toast('That file is over 120 MB. Export fewer conversations or split it.', true); return; }
      f.text().then(raw => { S.ui.imp = {name: f.name, convs: parseExport(f.name, raw)}; if (S.ui.imp.convs.length <= 3) S.ui.imp.convs.forEach(c => { c.sel = true; }); schedule(); }).catch(() => toast('Could not read that file.', true));
    }
    if (t.id === 'bk-file' && t.files && t.files[0]) { restoreBackup(t.files[0]); t.value = ''; }
  });
  document.addEventListener('toggle', ev => { const d = ev.target; if (d && d.dataset && d.dataset.open) S.ui.open[d.dataset.open] = d.open; }, true);
  document.addEventListener('focusout', () => { if (S.pendingRender) setTimeout(() => { if (S.pendingRender && !isTyping()) schedule(); }, 400); });
  document.addEventListener('pointerover', ev => { const t = ev.target.closest && ev.target.closest('[data-tip]'); if (t) showTip(t.getAttribute('data-tip'), ev); else hideTip(); });
  document.addEventListener('pointermove', ev => posTip(ev));
  window.addEventListener('scroll', hideTip, {passive: true});
}

async function boot() {
  const h = (location.hash || '').replace('#', '');
  if (VIEWS.some(v => v.k === h)) S.view = h;
  bindEvents(); render();
  const c = window.claude;
  if (!c || typeof c.use !== 'function') { S.status = 'nodb'; render(); return; }
  c.use('sample').then(x => { S.cap.sample = x; schedule(); }).catch(() => {});
  c.use('downloads').then(x => { S.cap.downloads = x; schedule(); }).catch(() => {});
  c.use('permissions').then(x => { S.cap.perm = x; if (x) x.state('sample').then(st => { if (st === 'denied' || st === 'unavailable') { S.ai = 'off'; schedule(); } }).catch(() => {}); }).catch(() => {});
  let db = null, user = null;
  try { [db, user] = await Promise.all([c.use('db'), c.use('user')]); } catch {}
  S.cap.db = db; S.cap.user = user;
  if (!db || !user) { S.status = 'nodb'; render(); return; }
  try { S.uid = await user.id(); } catch { S.uid = null; }
  if (!S.uid) { S.status = 'nodb'; render(); return; }
  S.status = 'ready'; subscribe(); render();
  setInterval(() => { if (!isTyping() && !S.ui.sheet) renderChrome(); }, 60000);
}
boot();
