<title>مدرّب التفكير الشطرنجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap">
<style>
/* Layout: a training desk. Board on one side, the thinking sheet on the other; dashboards are scoresheet-like tables and small to-scale charts. */
:root {
  --paper: #f3f5f2; --surface: #ffffff; --sunk: #e9ede8; --ink: #17201c; --muted: #5a6962; --line: #d3dbd5;
  --accent: #1d6a56; --accent-soft: #d5e9e1; --accent-ink: #ffffff;
  --sq-light: #e8ece2; --sq-dark: #87a393; --sq-sel: #e9c46a; --sq-last: #c9d98a; --sq-dot: rgba(23,32,28,.28);
  --blunder: #b8382b; --mistake: #cf7a26; --inacc: #b8961f; --good: #2a7f50;
  --f-display: "Reem Kufi", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0f1412; --surface: #171f1b; --sunk: #1f2924; --ink: #e2e9e5; --muted: #9aaba2; --line: #2b3732;
  --accent: #5cc4a2; --accent-soft: #1d3a31; --accent-ink: #0d1411;
  --sq-light: #c7d1c2; --sq-dark: #6b8878; --sq-sel: #d9b24f; --sq-last: #a9bd6b; --sq-dot: rgba(10,16,13,.35);
  --blunder: #e0675a; --mistake: #e69a4f; --inacc: #d6b54a; --good: #5bbf85; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1412; --surface: #171f1b; --sunk: #1f2924; --ink: #e2e9e5; --muted: #9aaba2; --line: #2b3732;
  --accent: #5cc4a2; --accent-soft: #1d3a31; --accent-ink: #0d1411;
  --sq-light: #c7d1c2; --sq-dark: #6b8878; --sq-sel: #d9b24f; --sq-last: #a9bd6b; --sq-dot: rgba(10,16,13,.35);
  --blunder: #e0675a; --mistake: #e69a4f; --inacc: #d6b54a; --good: #5bbf85; color-scheme: dark }

[hidden] { display: none !important; }
html, body { background: var(--paper); color: var(--ink); }
body { font-family: var(--f-body); font-size: 15px; line-height: 1.65; }
#app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; line-height: 1.3; text-wrap: balance; margin: 0; }
h2 { font-size: 1.45rem; } h3 { font-size: 1.1rem; }
p { margin: 0; }
.mv, code, .mono { font-family: var(--f-mono); direction: ltr; unicode-bidi: isolate; font-size: .92em; }
a { color: var(--accent); }
button, input, textarea, select { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, .sq:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand img { width: 34px; height: 34px; }
.brand h1 { font-size: 1.35rem; }
.brand small { display: block; color: var(--muted); font-size: .8rem; font-family: var(--f-body); font-weight: 400; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }
nav button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
nav button:hover:not([aria-current="page"]) { background: var(--sunk); color: var(--ink); }

.status { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px; font-size: .8rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.ok::before { background: var(--good); } .chip.warn::before { background: var(--mistake); } .chip.bad::before { background: var(--blunder); }

main section { display: grid; gap: 18px; padding-block: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; gap: 12px; min-width: 0; }
.lead { color: var(--muted); max-width: 68ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.quiet { border-color: var(--line); background: var(--surface); color: var(--ink); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
label.f { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
label.f span.hint { font-weight: 400; color: var(--muted); font-size: .82rem; }
input[type=text], textarea, select { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; box-sizing: border-box; }
textarea { min-height: 64px; resize: vertical; line-height: 1.6; }
.note { font-size: .85rem; color: var(--muted); }
.err { color: var(--blunder); font-size: .9rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.kpi b { font-family: var(--f-mono); font-size: 1.5rem; font-weight: 500; font-variant-numeric: tabular-nums; direction: ltr; text-align: end; }
.kpi span { color: var(--muted); font-size: .82rem; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: .8rem; }
td.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; direction: ltr; text-align: end; }
.sev { display: inline-block; padding: 0 8px; border-radius: 999px; font-size: .78rem; color: #fff; }
.sev.blunder { background: var(--blunder); } .sev.mistake { background: var(--mistake); } .sev.inacc { background: var(--inacc); }
.tag { display: inline-block; padding: 0 8px; border-radius: 6px; background: var(--accent-soft); color: var(--ink); font-size: .78rem; margin-inline-end: 4px; }
.progress { height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }

/* board */
.train { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .train { grid-template-columns: minmax(0, 1fr); } }
.boardwrap { display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); }
@media (max-width: 820px) { .boardwrap { position: static; } }
.board { direction: ltr; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); user-select: none; }
.sq { position: relative; border: 0; padding: 0; margin: 0; cursor: pointer; display: block; aspect-ratio: 1; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq.last { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--sq-last) 55%, transparent); }
.sq.sel, .sq.pick { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--sq-sel) 70%, transparent); }
.sq img { position: absolute; inset: 4%; width: 92%; height: 92%; pointer-events: none; }
.sq.dot::after { content: ""; position: absolute; inset: 38%; border-radius: 50%; background: var(--sq-dot); }
.sq.dot.cap::after { inset: 4%; background: transparent; border: 4px solid var(--sq-dot); }
.sq .co { position: absolute; font: 600 10px/1 var(--f-mono); opacity: .7; pointer-events: none; color: var(--ink); }
.sq .co.f { bottom: 2px; right: 3px; } .sq .co.r { top: 2px; left: 3px; }
.sq.l .co { color: var(--sq-dark); } .sq.d .co { color: var(--sq-light); }
.boardcap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); }
.turn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.turn i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); }
.conf { display: flex; gap: 6px; flex-wrap: wrap; }
.conf label { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 36px; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font-family: var(--f-mono); }
.conf input { position: absolute; opacity: 0; pointer-events: none; }
.conf input:checked + span { color: var(--accent-ink); }
.conf label:has(input:checked) { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.coach { border-inline-start: 3px solid var(--accent); padding-inline-start: 12px; display: grid; gap: 8px; }
.coach .who { font-size: .78rem; color: var(--muted); letter-spacing: .02em; }
.lines { display: grid; gap: 4px; }
.lines div { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.lines .ev { font-family: var(--f-mono); min-width: 58px; direction: ltr; text-align: end; font-variant-numeric: tabular-nums; }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.scores div { background: var(--sunk); border-radius: 8px; padding: 6px 10px; font-size: .85rem; display: flex; justify-content: space-between; gap: 6px; }
.scores b { font-family: var(--f-mono); }
.prewrap { white-space: pre-wrap; }
.mode { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: start; padding-block: 10px; border-bottom: 1px solid var(--line); }
.mode:last-child { border-bottom: 0; }
.mode .n { font-family: var(--f-mono); color: var(--muted); }
.state { font-size: .78rem; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
.state.on { background: var(--accent); color: var(--accent-ink); } .state.part { background: var(--accent-soft); color: var(--ink); } .state.next { background: var(--sunk); color: var(--muted); }
svg text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; }
svg .ax { stroke: var(--line); } svg .bar { fill: var(--accent); } svg .ln { stroke: var(--accent); fill: none; stroke-width: 2; }
svg .ref { stroke: var(--muted); stroke-dasharray: 4 4; fill: none; } svg .pt { fill: var(--accent); } svg .area { fill: var(--accent-soft); }
.chart { overflow-x: auto; }
.empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: var(--r); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="brand"><img id="brandimg" alt=""><div><h1>مدرّب التفكير الشطرنجي</h1><small>العملية قبل النقلة، والبيانات قبل التشجيع</small></div></div>
    <nav id="nav">
      <button data-view="today" aria-current="page">اليوم</button>
      <button data-view="diag">التشخيص</button>
      <button data-view="train">التدريب</button>
      <button data-view="progress">التقدم</button>
      <button data-view="plan">المنهج</button>
    </nav>
  </header>
  <div class="status" id="status"><span class="chip" id="st-store">التخزين: جارٍ التحميل</span><span class="chip" id="st-engine">Stockfish: جارٍ التشغيل</span><span class="chip" id="st-claude">Claude: جارٍ الاتصال</span></div>
  <main>
    <section id="v-today"></section>
    <section id="v-diag" hidden></section>
    <section id="v-train" hidden></section>
    <section id="v-progress" hidden></section>
    <section id="v-plan" hidden></section>
  </main>
</div>

    if (this.kind === "local") { try { const v = localStorage.getItem("cc:" + path); return v ? JSON.parse(v) : null; } catch { return null; } }

  },
  async set(path, data) {

    if (this.kind === "local") { try { localStorage.setItem("cc:" + path, JSON.stringify(body)); } catch {} return; }
    this.mem[path] = body;
  },

    const out = [];

/* ---------- Stockfish in a worker ---------- */
function parseInfo(l) {
  if (/ (lower|upper)bound/.test(l)) return null;
  const d = l.match(/\bdepth (\d+)/), mp = l.match(/\bmultipv (\d+)/), sc = l.match(/\bscore (cp|mate) (-?\d+)/), pv = l.match(/ pv (.+?)(?: bmc .*)?$/);
  if (!d || !sc || !pv) return null;
  return { depth: +d[1], multipv: mp ? +mp[1] : 1, cp: sc[1] === "cp" ? +sc[2] : null, mate: sc[1] === "mate" ? +sc[2] : null, pv: pv[1].trim().split(/\s+/) };
}
const scoreCp = (s) => s.mate != null ? (s.mate > 0 ? 10000 - s.mate * 10 : -10000 - s.mate * 10) : s.cp;
const Engine = {
  w: null, onLine: null, chain: Promise.resolve(), ok: false,
  async start() {
    const boot = (w) => new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error("timeout")), 25000);
      w.onerror = (e) => { clearTimeout(t); rej(e); };
      w.onmessage = (e) => { const l = String(e.data); if (l === "uciok") { clearTimeout(t); res(w); } };
      w.postMessage("uci");
    });
    try { this.w = await boot(new Worker("stockfish.js")); }
    catch {
      const src = await (await fetch("stockfish.js")).text();
      this.w = await boot(new Worker(URL.createObjectURL(new Blob([src], { type: "text/javascript" }))));
    }
    this.w.onmessage = (e) => { const l = String(e.data); if (this.onLine) this.onLine(l); };
    this.ok = true;
  },
  // Score in result is from WHITE's point of view (centipawns; mate encoded as ±(10000 - 10n)).
  analyse(fen, { movetime = 0, depth = 0, multipv = 1 } = {}) {
    const job = () => new Promise((res) => {
      const g = new Chess(fen);
      if (g.game_over()) { const cpStm = g.in_checkmate() ? -10000 : 0; const cp = sideOf(fen) === "w" ? cpStm : -cpStm; return res({ best: null, cp, lines: [], terminal: true }); }
      const lines = {};
      this.onLine = (l) => {
        if (l.startsWith("info")) { const p = parseInfo(l); if (p) lines[p.multipv] = p; }
        else if (l.startsWith("bestmove")) {
          this.onLine = null;
          const flip = sideOf(fen) === "w" ? 1 : -1;
          const ls = Object.values(lines).sort((a, b) => a.multipv - b.multipv).map((x) => ({ ...x, cpWhite: flip * scoreCp(x) }));
          res({ best: l.split(" ")[1], cp: ls[0] ? ls[0].cpWhite : 0, lines: ls });
        }
      };
      this.w.postMessage("setoption name MultiPV value " + multipv);
      this.w.postMessage("position fen " + fen);
      let go = "go"; if (depth) go += " depth " + depth; if (movetime) go += " movetime " + movetime;
      this.w.postMessage(go);
    });
    const p = this.chain.then(job, job); this.chain = p.catch(() => {}); return p;
  },
};

/* ---------- PGN parsing ---------- */
function splitPgn(text) {
  const games = []; let cur = { h: [], m: [] }; let inMoves = false;
  for (const line of text.replace(/\r/g, "").split("\n")) {
    if (/^\s*\[\w+\s+"/.test(line)) { if (inMoves) { games.push(cur); cur = { h: [], m: [] }; inMoves = false; } cur.h.push(line); }
    else if (line.trim()) { inMoves = true; cur.m.push(line); }
  }
  if (cur.h.length || cur.m.length) games.push(cur);
  return games.filter((g) => g.m.length);
}
function parseClock(s) { const m = s.match(/\[%clk\s+(\d+):(\d+):(\d+(?:\.\d+)?)\]/); return m ? +m[1] * 3600 + +m[2] * 60 + +m[3] : null; }
function parseGame(raw) {
  const H = {}; for (const l of raw.h) { const m = l.match(/\[(\w+)\s+"(.*)"\]/); if (m) H[m[1]] = m[2]; }
  const text = raw.m.join("\n");
  const sans = [], clocks = []; let i = 0, depth = 0;
  while (i < text.length) {
    const c = text[i];
    if (c === "{") { const j = text.indexOf("}", i); const body = text.slice(i, j < 0 ? text.length : j); if (!depth && sans.length) { const k = parseClock(body); if (k != null) clocks[sans.length - 1] = k; } i = j < 0 ? text.length : j + 1; continue; }
    if (c === ";") { const j = text.indexOf("\n", i); i = j < 0 ? text.length : j + 1; continue; }
    if (c === "(") { depth++; i++; continue; }
    if (c === ")") { depth--; i++; continue; }
    if (/\s/.test(c)) { i++; continue; }
    let j = i; while (j < text.length && !/[\s{}();]/.test(text[j])) j++;
    const tok = text.slice(i, j); i = j;
    if (depth) continue;
    if (/^\$\d+$/.test(tok) || /^(1-0|0-1|1\/2-1\/2|\*)$/.test(tok)) continue;
    const t = tok.replace(/^\d+\.+/, "").replace(/[!?]+$/, "");
    if (t) sans.push(t);
  }
  const g = new Chess(H.FEN || START_FEN); const ucis = [], sanOk = [];
  for (const s of sans) { const m = g.move(s, { sloppy: true }); if (!m) break; ucis.push(m.from + m.to + (m.promotion || "")); sanOk.push(m.san); }
  const tc = H.TimeControl && /^\d+/.test(H.TimeControl) ? +H.TimeControl.split("+")[0] : null;
  const id = hash([H.Site, H.Link, H.Date, H.UTCTime, H.White, H.Black, sanOk.slice(0, 30).join(" ")].join("|"));
  return { id, H, start: H.FEN || START_FEN, ucis, sans: sanOk, clocks: clocks.slice(0, sanOk.length), tc };
}

  const startWhite = sideOf(pg.start) === "w";
  for (let i = 0; i < pg.ucis.length; i++) {
    const mover = (i % 2 === 0) === startWhite ? "w" : "b";
    if (mover !== userColor) continue;
    const before = uWp(i), after = uWp(i + 1); maxWp = Math.max(maxWp, before);
    const drop = Math.max(0, before - after);
    const cpLoss = Math.min(1000, Math.max(0, sgn * (ev[i].cp - ev[i + 1].cp)));
    lossSum += cpLoss; n++;
    accSum += Math.max(0, Math.min(100, 103.1668 * Math.exp(-0.04354 * drop) - 3.1669));
    if (pg.ucis[i] === ev[i].best) continue;
    if (drop >= 5 && drop < 10) inacc++;
    if (drop < 10) continue;
    // classify the cause
    const fen = fens[i], causes = [];
    const clock = pg.clocks[i];
    if (clock != null && pg.tc && (clock < 30 || clock < pg.tc * 0.1)) causes.push("time");
    const prevOppDrop = i >= 1 ? Math.max(0, (100 - uWp(i - 1)) - (100 - before)) : 0;
    if (prevOppDrop >= 15 && ev[i].best && isForcing(fen, ev[i].best)) causes.push("missed_opportunity");
    let hadThreat = false, threatMove = null;
    if (!new Chess(fen).in_check()) {
      const nf = nullMoveFen(fen);
      if (new Chess(nf).validate_fen(nf).valid) {
        const ne = await Engine.analyse(nf, { movetime: Math.max(120, movetime), depth: 14 });
        hadThreat = before - wp(sgn * ne.cp) >= 15; threatMove = ne.best;
      }
    }
    const reply = ev[i + 1].best;
    const replyForcing = reply ? isForcing(fens[i + 1], reply) : false;
    if (hadThreat && reply && threatMove && (reply === threatMove || reply.slice(2, 4) === threatMove.slice(2, 4))) causes.push("missed_threat");
    else if (replyForcing && !hadThreat) causes.push("blunder_check");
    const userForcing = isForcing(fen, pg.ucis[i]);
    const inSequence = i >= 2 && isForcing(fens[i - 2], pg.ucis[i - 2]) && isForcing(fens[i - 1], pg.ucis[i - 1]);
    if (inSequence && !causes.includes("missed_threat")) causes.push("visualization");
    else if (userForcing) causes.push("calculation");
    if (before >= 75) causes.push("conversion");
    if (!causes.some((c) => c !== "conversion" && c !== "time")) causes.push(i < 20 ? "opening" : "plan");
    const bestLine = ev[i].lines[0] ? pvToSan(fen, ev[i].lines[0].pv, 6) : [];
    mistakes.push({
      ply: i, fen, played: pg.sans[i], playedUci: pg.ucis[i], best: bestLine[0] || null, bestUci: ev[i].best, bestLine,
      refutation: reply ? pvToSan(fens[i + 1], ev[i + 1].lines[0] ? ev[i + 1].lines[0].pv : [reply], 6) : [],
      before: Math.round(before), after: Math.round(after), drop: Math.round(drop),
      sev: drop >= 15 ? "blunder" : "mistake", causes, phase: phaseOf(fen, i), clock: clock ?? null,
      lastMove: i >= 1 ? pg.ucis[i - 1] : null, lastSan: i >= 1 ? pg.sans[i - 1] : null,
    });
  }
  const res = (pg.H.Result || "*");
  const outcome = res === "1/2-1/2" ? "d" : (res === "1-0") === (userColor === "w") ? (res === "*" ? "?" : "w") : "l";
  const oppName = userColor === "w" ? pg.H.Black : pg.H.White;
  const rating = +(userColor === "w" ? pg.H.WhiteElo : pg.H.BlackElo) || null;
  return {
    id: pg.id, date: (pg.H.UTCDate || pg.H.Date || "").replace(/\./g, "-"), white: pg.H.White, black: pg.H.Black, opp: oppName, userColor,
    result: res, outcome, rating, tc: pg.H.TimeControl || null, opening: pg.H.Opening || pg.H.ECOUrl?.split("/").pop()?.replace(/-/g, " ") || pg.H.ECO || "",
    site: pg.H.Site || pg.H.Link || "", termination: pg.H.Termination || "", moves: n, sans: pg.sans, start: pg.start,
    evals: ev.map((e) => e.cp), acpl: n ? Math.round(lossSum / n) : 0, accuracy: n ? Math.round(accSum / n) : 0,
    inaccuracies: inacc, mistakes, maxWp: Math.round(maxWp), movetime, analysedAt: now(),
  };
}

function buildProfile(games) {
  const P = { games: games.length, moves: 0, accuracy: 0, acpl: 0, blunders: 0, mistakes: 0, inaccuracies: 0, causes: {}, phases: {}, conversion: { chances: 0, converted: 0 }, results: { w: 0, d: 0, l: 0 }, ratings: [], timeLosses: 0 };
  for (const k of Object.keys(CAUSES)) P.causes[k] = { n: 0, w: 0 };
  for (const ph of ["opening", "middlegame", "endgame"]) P.phases[ph] = { errors: 0, weight: 0 };
  let accW = 0, acplW = 0;
  for (const g of games) {
    P.moves += g.moves; accW += g.accuracy * g.moves; acplW += g.acpl * g.moves; P.inaccuracies += g.inaccuracies;
    if (P.results[g.outcome] != null) P.results[g.outcome]++;
    if (g.maxWp >= 85) { P.conversion.chances++; if (g.outcome === "w") P.conversion.converted++; }
    if (/time/i.test(g.termination) && g.outcome === "l") P.timeLosses++;
    if (g.rating && g.date) P.ratings.push({ d: g.date, r: g.rating, tc: g.tc });
    for (const m of g.mistakes) {
      m.sev === "blunder" ? P.blunders++ : P.mistakes++;
      const sw = m.sev === "blunder" ? 3 : 2;
      m.causes.forEach((c, idx) => { if (!P.causes[c]) return; P.causes[c].n++; P.causes[c].w += sw * (idx === 0 ? 1 : 0.5); });
      P.phases[m.phase].errors++; P.phases[m.phase].weight += sw;
    }
  }
  P.accuracy = P.moves ? Math.round(accW / P.moves) : 0; P.acpl = P.moves ? Math.round(acplW / P.moves) : 0;
  P.per100 = P.moves ? +(100 * (P.blunders + P.mistakes) / P.moves).toFixed(1) : 0;
  P.ratings.sort((a, b) => a.d.localeCompare(b.d));
  const tot = Object.values(P.causes).reduce((s, c) => s + c.w, 0) || 1;
  P.ranked = Object.entries(P.causes).filter(([, c]) => c.n).map(([k, c]) => ({ k, n: c.n, share: Math.round(100 * c.w / tot) })).sort((a, b) => b.share - a.share);
  P.updatedAt = now();
  return P;
}

/* ---------- spaced repetition (SM-2) ---------- */
function sm2(card, q) {
  card.ef = card.ef ?? 2.5; card.reps = card.reps ?? 0; card.interval = card.interval ?? 0; card.lapses = card.lapses ?? 0;
  if (q < 3) { card.reps = 0; card.interval = 1; card.lapses++; }
  else { card.reps++; card.interval = card.reps === 1 ? 1 : card.reps === 2 ? 3 : Math.round(card.interval * card.ef); }
  card.ef = Math.max(1.3, card.ef + (0.1 - (5 - q) * (0.08 + (5 - q) * 0.02)));
  card.due = now() + card.interval * DAY;
  card.history = [...(card.history || []), { t: now(), q }].slice(-30);
  return card;
}
function skillFromCauses(m) {
  if (m.phase === "endgame") return "endgame";
  const c = m.causes[0];
  if (c === "missed_threat" || c === "blunder_check") return "defence";
  if (c === "plan" || c === "opening" || c === "conversion") return "strategy";
  return "tactics";
}
function cardFromMistake(g, m) {
  return { id: "g-" + g.id + "-" + m.ply, source: "game", fen: m.fen, lastMove: m.lastMove, lastSan: m.lastSan, played: m.played, best: m.best, bestUci: m.bestUci,
    causes: m.causes, skill: skillFromCauses(m), sev: m.sev, opp: g.opp, date: g.date, ef: 2.5, reps: 0, interval: 0, lapses: 0, due: now(), created: now() };
}

/* ---------- board ---------- */
function Board(el, { fen, orient, last, onPick }) {
  const game = new Chess(fen); let sel = null; let pick = null;
  const files = "abcdefgh";
  function draw() {
    const legal = sel ? game.moves({ square: sel, verbose: true }) : [];
    let html = "";
    for (let row = 0; row < 8; row++) for (let col = 0; col < 8; col++) {
      const f = orient === "w" ? col : 7 - col, r = orient === "w" ? 7 - row : row;
      const sq = files[f] + (r + 1); const p = game.get(sq); const light = (f + r) % 2 === 1;
      const cls = ["sq", light ? "l" : "d"];
      if (last && (last.slice(0, 2) === sq || last.slice(2, 4) === sq)) cls.push("last");
      if (sel === sq) cls.push("sel");
      if (pick && (pick.from === sq || pick.to === sq)) cls.push("pick");
      const lm = legal.find((m) => m.to === sq); if (lm) cls.push("dot", lm.captured ? "cap" : "");
      const co = (col === 0 ? `<span class="co r">${r + 1}</span>` : "") + (row === 7 ? `<span class="co f">${files[f]}</span>` : "");
      html += `<button type="button" class="${cls.join(" ")}" data-sq="${sq}" aria-label="${sq}${p ? " " + p.color + p.type : ""}">${p ? `<img alt="" src="${PIECES[p.color + p.type]}">` : ""}${co}</button>`;
    }
    el.innerHTML = html;
  }
  el.onclick = (e) => {
    const b = e.target.closest(".sq"); if (!b) return; const sq = b.dataset.sq; const p = game.get(sq);
    if (sel) {
      const m = game.moves({ square: sel, verbose: true }).find((x) => x.to === sq);
      if (m) { const g2 = new Chess(fen); const made = g2.move({ from: m.from, to: m.to, promotion: "q" }); pick = { from: m.from, to: m.to, san: made.san, uci: m.from + m.to + (made.promotion || "") }; sel = null; draw(); onPick && onPick(pick); return; }
    }
    sel = p && p.color === game.turn() && sel !== sq ? sq : null; draw();
  };
  draw();
  return { setPick(p) { pick = p; draw(); }, };
}

async function runDiagnosis(list, movetime) {
  if (!Engine.ok) { $("#d-ptext").textContent = "Stockfish لم يعمل بعد."; return; }
  const me = S.profile.username.toLowerCase();
  D = { ctl: new AbortController(), running: true };
  $("#d-prog").hidden = false; $("#d-go").disabled = true;
  const totalPlies = list.reduce((s, g) => s + g.ucis.length + 1, 0); let done = 0; const t0 = now();
  try {
    for (let k = 0; k < list.length; k++) {
      const pg = list[k]; const color = (pg.H.White || "").toLowerCase() === me ? "w" : "b";
      const res = await analyseGame(pg, color, movetime, (i) => {
        done++; const bar = $("#d-bar"); if (bar) bar.style.width = (100 * done / totalPlies).toFixed(1) + "%";
        const eta = Math.max(0, Math.round(((now() - t0) / done) * (totalPlies - done) / 1000));
        const t = $("#d-ptext"); if (t) t.textContent = `المباراة ${k + 1} من ${list.length} ضد ${color === "w" ? pg.H.Black : pg.H.White}: الموقف ${i + 1}. الوقت المتبقي تقريبًا ${Math.floor(eta / 60)} د ${eta % 60} ث`;
      }, D.ctl.signal);
      S.games[res.id] = res; await Store.set("games/" + res.id, res);
      for (const m of res.mistakes) { const c = cardFromMistake(res, m); if (!S.cards[c.id]) { S.cards[c.id] = c; await Store.set("cards/" + c.id, c); } }
      S.profile.stats = buildProfile(Object.values(S.games)); await Store.set("coach/profile", S.profile);
      if (S.view === "diag") renderDiagResults(Object.values(S.games).sort((a, b) => (b.date || "").localeCompare(a.date || "")));
    }
  } catch (e) { if (e.message !== "stopped") console.error(e); }
  D.running = false; D.msg = D.ctl.signal.aborted ? "توقف التحليل. المباريات التي اكتملت محفوظة." : "انتهى التحليل. النتائج أدناه، والأخطاء أُضيفت إلى بطاقات المراجعة.";

function buildSession(n = 6) {
  const due = dueCards().sort((a, b) => (a.source === "game" ? 0 : 1) - (b.source === "game" ? 0 : 1) || (b.sev === "blunder") - (a.sev === "blunder") || a.due - b.due);
  const tried = new Set(S.attempts.map((a) => a.itemId));
  const fresh = LIB.filter((p) => !tried.has(p.id) && !S.cards["lib-" + p.id]).map((p) => ({ ...p, source: "lib" }));
  const dueItems = due.slice(0, n).map((c) => { if (c.source !== "lib") return { ...c, itemId: c.id }; const p = LIB.find((x) => "lib-" + x.id === c.id); return p ? { ...p, source: "lib", itemId: p.id } : null; }).filter(Boolean);
  const pool = [...dueItems, ...fresh.map((x) => ({ ...x, itemId: x.id }))];
  // interleave: never the same skill twice in a row when avoidable
  const out = []; const left = pool.slice();
  while (out.length < n && left.length) {
    const lastSkill = out.length ? out[out.length - 1].skill : null;
    let i = left.findIndex((x) => x.skill !== lastSkill); if (i < 0) i = 0;
    out.push(left.splice(i, 1)[0]);
  }
  return out;
}

  if (pick) return pick;

async function engineFor(it) {

  const eng = await engineFor(it); const stm = sideOf(it.fen); const s = stm === "w" ? 1 : -1;

  const ea = await Engine.analyse(after, { depth: 16, movetime: 2000 });
  const bestWp = wp(s * eng.cp), playedWp = wp(s * ea.cp);

  const correct = move.uci === eng.best || loss <= 5;
  return { loss: Math.round(loss), correct, playedCp: ea.cp, refutation: ea.lines[0] ? pvToSan(after, ea.lines[0].pv, 6) : [], after };
}

function socraticPrompt(C) {
  const it = C.it; const stm = sideOf(it.fen) === "w" ? "White" : "Black";
  const hist = C.tries.map((t, k) => `Attempt ${k + 1}: played ${t.move} (loses ${t.loss} win-probability points). Engine refutation after it: ${t.refutation.join(" ") || "n/a"}.${t.question ? " Coach asked: " + t.question : ""}${t.answer ? " Student answered: " + t.answer : ""}`).join("\n");
  const r = C.tries[0].reasoning || {};
  return `You are a Socratic chess coach. The student (a beginner, ${stm} to move) chose a wrong move. Do NOT give the answer.
${LANG_RULES}
RULES: Ask exactly ONE short guiding question in Arabic (max 35 words) that leads the student to discover WHY their move fails (usually: what the opponent plays after it, per the refutation line) or which forcing move they overlooked. Do not name the best move, its piece+square, or its target square. You may point to a region, a piece type, or a concept ("what does the knight on f3 attack after...?" is fine only if it is NOT the best move itself). Build on the previous question/answer if any; get more specific each time.
Reply with only JSON: {"question_ar": "..."}

POSITION FEN: ${it.fen}
PIECES: ${pieceList(it.fen)}
ENGINE DATA (Stockfish, best lines from the position; do not reveal):
${engineSummary(it, C.eng)}
STUDENT'S FIRST REASONING: threats=${r.opp || ""} | forcing/imbalances=${r.mine || ""} | candidates=${r.cands || ""} | lines=${r.lines || ""} | evaluation=${r.evalt || ""} | blunder-check=${r.bc || ""}
HISTORY:
${hist}`;
}
function critiquePrompt(C) {
  const it = C.it; const stm = sideOf(it.fen) === "w" ? "White" : "Black"; const r = C.tries[0].reasoning || {};
  const hist = C.tries.map((t, k) => `Attempt ${k + 1}: ${t.move} — ${t.correct ? "correct" : "loses " + t.loss + " win-probability points; refutation: " + (t.refutation.join(" ") || "n/a")}${t.answer ? " | student's answer to the coach's question: " + t.answer : ""}`).join("\n");
  return `You are a demanding chess coach in the tradition of Heisman, Aagaard and Dvoretsky. Critique the student's THINKING PROCESS, not just the move. ${stm} to move.
${LANG_RULES}
Score each process step 0-2 (0 = missing or wrong, 1 = partial, 2 = solid): threats (did they find the opponent's threats / what changed), candidates (did they list the forcing moves and the engine's best move among candidates), calculation (did their lines go to a quiet position and include the opponent's best replies), evaluation (did they assess imbalances and state a plan), blunder_check (did they check the opponent's forcing replies to their chosen move).
Then: explain the position's key idea using ONLY the engine lines, say concretely what the student missed, and give one habit for next time. Be direct and honest; no praise unless earned.
Reply with only JSON:
{"scores":{"threats":0,"candidates":0,"calculation":0,"evaluation":0,"blunder_check":0},"verdict_ar":"one sentence","process_ar":"3-5 sentences on the process","missed_ar":["..."],"explanation_ar":"the key idea of the position, grounded in the engine lines","pattern_en":"short English motif name","next_time_ar":"one concrete habit"}

POSITION FEN: ${it.fen}
PIECES: ${pieceList(it.fen)}
${it.lastSan ? "OPPONENT'S LAST MOVE: " + it.lastSan + "\n" : ""}${it.source === "game" ? `This position is from the student's own game; there they played ${it.played}, the engine preferred ${it.best}. Heuristic cause labels: ${it.causes.join(", ")}.\n` : ""}ENGINE DATA (Stockfish 10, multipv 3, depth ~18):
${engineSummary(it, C.eng)}
STUDENT'S WRITTEN REASONING (before seeing anything):
- threats / what changed: ${r.opp || "(empty)"}
- own forcing moves / imbalances: ${r.mine || "(empty)"}
- candidates: ${r.cands || "(empty)"}
- calculation: ${r.lines || "(empty)"}
- evaluation / plan: ${r.evalt || "(empty)"}
- final move: ${C.tries[0].move}
- blunder check: ${r.bc || "(empty)"}
- confidence: ${C.conf}/5
ATTEMPTS:
${hist}`;
}
function heuristicScores(C) {
  const r = C.tries[0].reasoning || {}; const has = (s) => (s || "").trim().length > 3 ? 1 : 0;
  return { threats: has(r.opp), candidates: has(r.cands), calculation: has(r.lines), evaluation: has(r.evalt), blunder_check: has(r.bc) };
}

function critiqueHtml(c) {
  const sc = c.scores || {};
  return `<div class="coach"><span class="who">نقد العملية${c.heuristic ? " (بدون Claude)" : " · Claude، مقيّد بخطوط Stockfish"}</span>
    ${c.verdict_ar ? `<b>${esc(c.verdict_ar)}</b>` : ""}
    <div class="scores">${Object.keys(CHECK_AR).map((k) => `<div><span>${CHECK_AR[k]}</span><b>${sc[k] ?? "–"}/2</b></div>`).join("")}</div>
    ${c.process_ar ? `<p>${esc(c.process_ar)}</p>` : ""}
    ${Array.isArray(c.missed_ar) && c.missed_ar.length ? `<div><b>ما فاتك:</b><ul>${c.missed_ar.map((x) => `<li>${esc(x)}</li>`).join("")}</ul></div>` : ""}
    ${c.explanation_ar ? `<p><b>الفكرة:</b> ${esc(c.explanation_ar)}</p>` : ""}
    ${c.next_time_ar ? `<p><b>في المرة القادمة:</b> ${esc(c.next_time_ar)}</p>` : ""}
    ${c.pattern_en ? `<span class="tag mono">${esc(c.pattern_en)}</span>` : ""}</div>`;
}
async function saveResult() {
  const C = T.cur; const it = C.it; const first = C.tries[0];
  const solvedAt = C.correct ? C.tries.length : 0;
  const q = solvedAt === 1 ? (C.conf >= 4 ? 5 : 4) : solvedAt === 2 ? 3 : solvedAt === 3 ? 2 : 1;
  const sc = C.critique?.scores || {}; const vals = Object.keys(CHECK_AR).map((k) => Math.max(0, Math.min(2, +sc[k] || 0)));
  const attempt = {
    id: "a" + now().toString(36) + Math.random().toString(36).slice(2, 6), t: now(), mode: "thinkaloud", itemId: it.itemId || it.id, source: it.source, skill: it.skill, fen: it.fen,
    confidence: C.conf, firstCorrect: !!first.correct, solvedAt, revealed: !!C.revealed, tries: C.tries.map((t) => ({ move: t.move, loss: t.loss, correct: t.correct, question: t.question, answer: t.answer })),
    reasoning: first.reasoning, bestSan: C.eng.lines[0] ? pvToSan(it.fen, C.eng.lines[0].pv, 1)[0] : null, engineCp: C.eng.cp,
    scores: Object.fromEntries(Object.keys(CHECK_AR).map((k, i) => [k, vals[i]])), process: Math.round(100 * vals.reduce((a, b) => a + b, 0) / 10), heuristic: !!C.critique?.heuristic,
    critique: C.critique && !C.critique.heuristic ? C.critique : null, seconds: Math.round((now() - C.t0) / 1000),
  };
  S.attempts.push(attempt);
  try { await Store.set("attempts/" + attempt.id, attempt); } catch (e) { console.error(e); }
  const cid = it.source === "lib" ? "lib-" + it.id : it.id;
  let card = S.cards[cid];
  if (!card && q < 4) card = { id: cid, source: it.source, fen: it.fen, skill: it.skill, lastMove: it.lastMove || null, lastSan: it.lastSan || null, created: now() };
  if (card) { sm2(card, q); S.cards[cid] = card; try { await Store.set("cards/" + cid, card); } catch (e) { console.error(e); } }
  T.results.push({ correct: !!C.correct });
  if (q < 3 && !T.requeued.has(cid)) { T.requeued.add(cid); T.queue.push({ ...it }); }
  C.saved = true;
}

/* ----- progress dashboard ----- */
function barChart(rows, unit = "") {
  if (!rows.length) return `<p class="empty">لا توجد بيانات بعد.</p>`;
  const W = 640, rowH = 28, labelW = 230, gutter = 84, H = rows.length * rowH + 10; const max = Math.max(...rows.map((r) => r.value), 1);
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:${W}px;min-width:420px;direction:ltr" role="img" aria-label="bar chart">
    ${rows.map((r, i) => { const y = i * rowH + 4; const w = (W - labelW - gutter) * r.value / max;
      return `<text x="${W - 4}" y="${y + 16}" text-anchor="end" style="font-family:var(--f-body);font-size:12px;fill:var(--ink)">${esc(r.label)}</text>
      <rect class="bar" x="${W - labelW - w}" y="${y + 4}" width="${Math.max(1, w)}" height="16" rx="3"></rect>
      <text x="${W - labelW - w - 6}" y="${y + 16}" text-anchor="end">${r.value}${unit}${r.n != null ? " · " + r.n : ""}</text>`; }).join("")}
  </svg>`;
}
function lineChart(pts, { yMin, yMax, fmt = (v) => v, ref = null, w = 640, h = 200 } = {}) {
  if (pts.length < 2) return `<p class="empty">تحتاج نقطتين على الأقل لرسم الاتجاه.</p>`;
  const pad = { l: 46, r: 14, t: 12, b: 26 };
  const lo = yMin ?? Math.min(...pts.map((p) => p.y)), hi = yMax ?? Math.max(...pts.map((p) => p.y)); const span = hi - lo || 1;
  const X = (i) => pad.l + (w - pad.l - pad.r) * i / (pts.length - 1), Y = (v) => pad.t + (h - pad.t - pad.b) * (1 - (v - lo) / span);
  const ticks = [lo, lo + span / 2, hi];
  const d = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join("");
  const area = d + `L${X(pts.length - 1).toFixed(1)},${Y(lo)}L${X(0)},${Y(lo)}Z`;
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;min-width:420px;direction:ltr" role="img">
    ${ticks.map((t) => `<line class="ax" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(t)}" y2="${Y(t)}"></line><text x="${pad.l - 6}" y="${Y(t) + 4}" text-anchor="end">${fmt(Math.round(t))}</text>`).join("")}
    ${ref != null ? `<line class="ref" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(ref)}" y2="${Y(ref)}"></line>` : ""}
    <path class="area" d="${area}" opacity=".6"></path><path class="ln" d="${d}"></path>
    <circle class="pt" cx="${X(pts.length - 1)}" cy="${Y(pts[pts.length - 1].y)}" r="4"></circle>
    <text x="${pad.l}" y="${h - 6}">${esc(pts[0].label || "")}</text><text x="${w - pad.r}" y="${h - 6}" text-anchor="end">${esc(pts[pts.length - 1].label || "")}</text>
  </svg>`;
}
function calibrationChart(att) {
  const bins = [1, 2, 3, 4, 5].map((c) => { const xs = att.filter((a) => a.confidence === c); return { c, n: xs.length, acc: xs.length ? 100 * xs.filter((a) => a.firstCorrect).length / xs.length : null }; });
  const w = 420, h = 260, pad = { l: 44, r: 14, t: 12, b: 34 };
  const X = (c) => pad.l + (w - pad.l - pad.r) * (c - 1) / 4, Y = (v) => pad.t + (h - pad.t - pad.b) * (1 - v / 100);
  const expected = (c) => (c - 0.5) * 20;
  const pts = bins.filter((b) => b.acc != null);
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:${w}px;direction:ltr" role="img" aria-label="calibration curve">
    ${[0, 50, 100].map((t) => `<line class="ax" x1="${pad.l}" x2="${w - pad.r}" y1="${Y(t)}" y2="${Y(t)}"></line><text x="${pad.l - 6}" y="${Y(t) + 4}" text-anchor="end">${t}%</text>`).join("")}
    ${[1, 2, 3, 4, 5].map((c) => `<text x="${X(c)}" y="${h - 14}" text-anchor="middle">${c}</text>`).join("")}
    <text x="${(w + pad.l) / 2}" y="${h - 1}" text-anchor="middle">confidence</text>
    <path class="ref" d="M${X(1)},${Y(expected(1))}L${X(5)},${Y(expected(5))}"></path>
    ${pts.length > 1 ? `<path class="ln" d="${pts.map((b, i) => `${i ? "L" : "M"}${X(b.c)},${Y(b.acc)}`).join("")}"></path>` : ""}
    ${pts.map((b) => `<circle class="pt" cx="${X(b.c)}" cy="${Y(b.acc)}" r="${3 + Math.min(6, Math.sqrt(b.n) * 1.5)}"></circle><text x="${X(b.c) + 8}" y="${Y(b.acc) - 6}">n=${b.n}</text>`).join("")}
  </svg>`;
}
function renderProgress() {

  <div class="panel"><h2>التصنيف عبر الزمن</h2><p class="note">من رؤوس ملفات PGN المستوردة (كل أنواع الوقت معًا).</p><div class="chart">${lineChart(ratings, {})}</div></div>
  <div class="cols">
    <div class="panel"><h2>منحنى المعايرة</h2><p class="note">الخط المتقطع = معايرة مثالية (ثقة 1 ≈ 10% صحيح، ثقة 5 ≈ 90%). النقطة تحت الخط تعني ثقة زائدة.</p><div class="chart">${A.length ? calibrationChart(A) : `<p class="empty">يظهر بعد أول محاولة.</p>`}</div>
      ${calGap != null && A.length >= 8 ? `<p>${calGap > 10 ? "أنت <b>مفرط الثقة</b>: ثقتك المتوسطة أعلى من دقتك الفعلية بـ " + calGap + " نقطة." : calGap < -10 ? "أنت <b>أقل ثقة</b> مما تستحق بـ " + (-calGap) + " نقطة." : "معايرتك قريبة من الواقع."}</p>` : A.length ? `<p class="note">الحكم على المعايرة يحتاج 8 محاولات على الأقل.</p>` : ""}</div>
    <div class="panel"><h2>الدقة حسب المهارة</h2><p class="note">صحيحة من المحاولة الأولى.</p><div class="chart">${barChart(bySkill, "%")}</div></div>
