<title>مدرّب التفكير الشطرنجي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a journey map of chapter nodes on a faint board grid; inside a chapter, the board sits beside the teacher. */

  --f-body: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

}

  --accent: #5cc4a2; --accent-soft: #1d3a31; --accent-ink: #0d1411;
  --sq-light: #c7d1c2; --sq-dark: #6b8878; --sq-sel: #d9b24f; --sq-last: #a9bd6b; --sq-dot: rgba(10,16,13,.35);
  --blunder: #e0675a; --mistake: #e69a4f; --inacc: #d6b54a; --good: #5bbf85;
  --arrow-good: #4fcf8f; --arrow-bad: #ff7a66; --arrow-plan: #6ea8ff; --arrow-alt: #f2b84b; --path: #34433c; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #0f1412; --surface: #171f1b; --sunk: #1f2924; --ink: #e2e9e5; --muted: #9aaba2; --line: #2b3732;
  --accent: #5cc4a2; --accent-soft: #1d3a31; --accent-ink: #0d1411;
  --sq-light: #c7d1c2; --sq-dark: #6b8878; --sq-sel: #d9b24f; --sq-last: #a9bd6b; --sq-dot: rgba(10,16,13,.35);

[hidden] { display: none !important; }
[hidden] { display: none !important; }

#app { max-width: 1120px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 48px; }

.mv, code, .mono { font-family: var(--f-mono); direction: ltr; unicode-bidi: isolate; font-size: .92em; }

.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding-block: 8px 14px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; } .brand img { width: 34px; height: 34px; } .brand h1 { font-size: 1.35rem; }
.brand small { display: block; color: var(--muted); font-size: .8rem; font-family: var(--f-body); font-weight: 400; }
nav { display: flex; flex-wrap: wrap; gap: 4px; }

nav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }

.status { display: flex; flex-wrap: wrap; gap: 6px; padding-block: 10px; font-size: .8rem; }

.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.ok::before { background: var(--good); } .chip.warn::before { background: var(--mistake); } .chip.bad::before { background: var(--blunder); }
main section { display: grid; gap: 16px; padding-block: 8px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; min-width: 0; align-content: start; }
.lead { color: var(--muted); max-width: 70ch; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); padding: 9px 18px; border-radius: 8px; cursor: pointer; font-weight: 600; min-height: 42px; }
.btn.big { padding: 12px 28px; font-size: 1.05rem; }

.note { font-size: .86rem; color: var(--muted); }
.err { color: var(--blunder); font-size: .9rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.kpis.small { grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 2px; }
.kpi b { font-family: var(--f-mono); font-size: 1.45rem; font-weight: 500; font-variant-numeric: tabular-nums; direction: ltr; text-align: end; }
.kpi span { color: var(--muted); font-size: .82rem; }
.tbl { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--muted); font-weight: 500; font-size: .8rem; }

.progress { height: 8px; background: var(--sunk); border-radius: 999px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.sessbar { display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 2; background: var(--paper); padding-block: 8px; }
.hero { background: linear-gradient(180deg, var(--accent-soft), var(--surface) 75%); }
/* training layout */
.train { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 820px) { .train { grid-template-columns: minmax(0, 1fr); } }
.boardwrap { display: grid; gap: 8px; }
.side { align-content: start; }
.board { direction: ltr; display: grid; grid-template-columns: repeat(8, 1fr); aspect-ratio: 1; width: 100%; max-width: 100%; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); user-select: none; touch-action: manipulation; }
.board.small { max-width: 320px; }
.board.shake { animation: shake .25s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.sq { position: relative; border: 0; padding: 0; margin: 0; cursor: pointer; display: block; aspect-ratio: 1; }
.sq.l { background: var(--sq-light); } .sq.d { background: var(--sq-dark); }
.sq.last { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--sq-last) 55%, transparent); }
.sq.sel, .sq.pick { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--sq-sel) 70%, transparent); }
.sq img { position: absolute; inset: 4%; width: 92%; height: 92%; pointer-events: none; }
.sq.dot::after { content: ""; position: absolute; inset: 38%; border-radius: 50%; background: var(--sq-dot); }
.sq.dot.cap::after { inset: 4%; background: transparent; border: 4px solid var(--sq-dot); }
.sq .co { position: absolute; font: 600 10px/1 var(--f-mono); opacity: .75; pointer-events: none; }
.sq .co.f { bottom: 2px; right: 3px; } .sq .co.r { top: 2px; left: 3px; }
.sq.l .co { color: var(--sq-dark); } .sq.d .co { color: var(--sq-light); }
.boardcap { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: .88rem; color: var(--muted); align-items: center; }
.turn { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; color: var(--ink); }
.turn i { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--muted); } .turn i.w { background: #fff; } .turn i.b { background: #111; }
.clock { font-family: var(--f-mono); font-weight: 600; color: var(--ink); direction: ltr; } .clock.low { color: var(--blunder); }
.prompt { font-size: 1rem; }
.big-q { font-size: 1.15rem; font-weight: 600; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.choices.two { grid-template-columns: 1fr 1fr; } .choices.col { grid-template-columns: 1fr; }
.choice { border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 12px; cursor: pointer; text-align: start; min-height: 46px; }
.choice:hover { border-color: var(--accent); } .choice.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.conf { display: flex; gap: 6px; flex-wrap: wrap; }
.conf button, .conf label { min-width: 46px; height: 46px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font-family: var(--f-mono); background: var(--paper); display: inline-flex; align-items: center; justify-content: center; }
.conf button:hover { background: var(--accent); color: var(--accent-ink); }
.confask { display: grid; gap: 8px; padding: 12px; border: 1px dashed var(--accent); border-radius: 10px; }
.callout { padding: 10px 12px; border-radius: 8px; background: var(--sunk); }
.callout.good { background: color-mix(in srgb, var(--good) 16%, var(--surface)); } .callout.bad { background: color-mix(in srgb, var(--blunder) 14%, var(--surface)); }
.coach { border-inline-start: 3px solid var(--accent); padding-inline-start: 12px; display: grid; gap: 6px; }
.coach .who { font-size: .78rem; color: var(--muted); }
.prewrap { white-space: pre-wrap; }
.steps { display: flex; flex-wrap: wrap; gap: 4px; font-size: .8rem; }
.steps span { padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--muted); }
.steps span.on { background: var(--accent); color: var(--accent-ink); } .steps span.done { background: var(--accent-soft); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; min-height: 8px; }
.chip-mv { border: 1px solid var(--accent); background: var(--surface); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.chip-mv.on { background: var(--accent); color: var(--accent-ink); }
.scores { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 6px; }
.scores div { background: var(--sunk); border-radius: 8px; padding: 6px 10px; font-size: .85rem; display: flex; justify-content: space-between; gap: 6px; }
.scores b { font-family: var(--f-mono); }
.facts { margin: 0; padding-inline-start: 18px; display: grid; gap: 4px; }
.lines { display: grid; gap: 4px; } .lines div { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.lines .ev { font-family: var(--f-mono); min-width: 52px; direction: ltr; text-align: end; font-variant-numeric: tabular-nums; }
.calc-line { display: flex; gap: 8px; align-items: baseline; padding: 6px 8px; border-radius: 8px; background: var(--sunk); flex-wrap: wrap; }
.calc-line.cur { outline: 2px solid var(--accent); } .calc-line .n { font-family: var(--f-mono); color: var(--muted); }
.moves { font-size: .9rem; line-height: 1.9; }
.stepper { justify-content: center; }
.modegrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.modecard { text-align: start; display: grid; gap: 4px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 16px; cursor: pointer; }
.modecard:hover { border-color: var(--accent); } .modecard b { font-family: var(--f-display); font-size: 1.08rem; font-weight: 600; } .modecard .n { color: var(--muted); font-size: .78rem; }
.chunkgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
.chunk { border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.chunk.learned { border-color: var(--accent); }

.mode { display: grid; grid-template-columns: auto 1fr auto; gap: 10px 14px; align-items: start; padding-block: 10px; border-bottom: 1px solid var(--line); }
.mode:last-child { border-bottom: 0; } .mode .n { font-family: var(--f-mono); color: var(--muted); }
.state { font-size: .78rem; padding: 1px 10px; border-radius: 999px; white-space: nowrap; }
.state.on { background: var(--accent); color: var(--accent-ink); } .state.next { background: var(--sunk); color: var(--muted); }
label.f { display: grid; gap: 4px; font-weight: 600; font-size: .92rem; }
input[type=range] { width: 100%; max-width: 320px; accent-color: var(--accent); }
svg text { fill: var(--muted); font-family: var(--f-mono); font-size: 11px; } svg text.lbl { fill: var(--ink); font-family: var(--f-body); font-size: 12px; }
svg .ax { stroke: var(--line); } svg .bar { fill: var(--accent); } svg .ln { stroke: var(--accent); fill: none; stroke-width: 2; }
svg .ref { stroke: var(--muted); stroke-dasharray: 4 4; fill: none; } svg .pt { fill: var(--accent); } svg .area { fill: var(--accent-soft); opacity: .7; }
.chart { overflow-x: auto; }
.empty { color: var(--muted); padding: 14px; border: 1px dashed var(--line); border-radius: var(--r); }

/* ---------- journey ---------- */
.eyebrow { font-size: .78rem; color: var(--accent); font-weight: 600; letter-spacing: .02em; }
.where { grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 16px 24px; background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }
.where-main { display: grid; gap: 4px; min-width: 0; }
.where-next { display: grid; gap: 4px; justify-items: start; }
.where-stat { display: grid; justify-items: center; } .where-stat .mono { font-size: 1.6rem; }
@media (max-width: 720px) { .where { grid-template-columns: 1fr; } .where-stat { justify-items: start; } }
.map { position: relative; width: 100%; border-radius: var(--r); background:
  linear-gradient(90deg, color-mix(in srgb, var(--line) 35%, transparent) 1px, transparent 1px) 0 0 / 48px 48px,
  linear-gradient(0deg, color-mix(in srgb, var(--line) 35%, transparent) 1px, transparent 1px) 0 0 / 48px 48px, var(--surface);
  border: 1px solid var(--line); overflow: hidden; }
.map svg.path { position: absolute; inset: 0; pointer-events: none; }
.map svg.path path { fill: none; stroke-width: 6; stroke-linecap: round; }
.map svg.path .done { stroke: var(--accent); }
.map svg.path .todo { stroke: var(--path); stroke-dasharray: 2 12; }
.part { position: absolute; inset-inline: 0; display: grid; justify-items: center; gap: 0; text-align: center; pointer-events: none; }
.part span { font-family: var(--f-display); font-size: 1.15rem; font-weight: 600; background: var(--surface); padding: 2px 14px; border-radius: 999px; border: 1px solid var(--line); }
.part small { color: var(--muted); font-size: .76rem; margin-top: 3px; background: var(--surface); padding: 0 8px; border-radius: 6px; }
.node { position: absolute; width: 52px; height: 52px; border-radius: 50%; border: 3px solid var(--path); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; font: 600 1.1rem var(--f-mono); padding: 0; z-index: 1; }
.node svg { width: 22px; height: 22px; }
.node.open { border-color: var(--accent); color: var(--accent); }
.node.done { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.node.locked { color: var(--muted); opacity: .85; }
.node.cur { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 22%, transparent); animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 11px color-mix(in srgb, var(--accent) 10%, transparent); } }
.nlabel { position: absolute; display: grid; gap: 1px; text-align: start; background: color-mix(in srgb, var(--surface) 88%, transparent); border: 0; border-radius: 10px; padding: 6px 10px; cursor: pointer; z-index: 1; }
.nlabel.r { justify-items: start; text-align: start; } .nlabel.l { justify-items: end; text-align: end; } /* each label hugs its node */
.nlabel .nnum { font-size: .76rem; color: var(--muted); } .nlabel .nnum em { font-style: normal; color: var(--accent); font-weight: 600; }
.nlabel .ntitle { font-family: var(--f-display); font-weight: 600; font-size: 1rem; line-height: 1.35; }
.nlabel.locked .ntitle { color: var(--muted); }
.nlabel .nst { font-size: .74rem; color: var(--muted); }
.pips { display: inline-flex; gap: 4px; margin-block: 2px; } .pips i { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--path); } .pips i.on { background: var(--accent); border-color: var(--accent); }
.chead { gap: 8px; } .chead h2 { font-size: 1.6rem; }
.topics, .checklist { margin: 0; padding-inline-start: 20px; display: grid; gap: 4px; }
.checklist li::marker { content: "☐  "; }
.stages { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 8px; align-content: start; }
.stage.done { border-color: var(--accent); }
.stage.off { opacity: .72; }
.stage-h { display: flex; align-items: center; gap: 8px; } .stage-h b { font-family: var(--f-display); font-size: 1.1rem; } .stage-h .state { margin-inline-start: auto; }
.sicon { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; } .sicon svg { width: 20px; height: 20px; }
.sletter { color: var(--muted); font-size: .8rem; }
.state.part { background: var(--accent-soft); color: var(--ink); }
.subnav { display: flex; flex-wrap: wrap; gap: 4px; }
.subnav button { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; }
.subnav button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
select { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
/* board extras */
.board { position: relative; }
.board svg.arrows { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.sq.threat { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--blunder) 30%, transparent); }
.sq.goodsq { box-shadow: inset 0 0 0 100px color-mix(in srgb, var(--good) 30%, transparent); }
.sq.focus { box-shadow: inset 0 0 0 3px var(--arrow-plan); }
/* ---------- watch ---------- */
.demos { display: grid; gap: 10px; }
.demo { display: grid; gap: 4px; justify-items: start; text-align: start; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 12px 14px; cursor: pointer; }
.demo:hover { border-color: var(--accent); } .demo b { font-family: var(--f-display); font-size: 1.05rem; }
.whead { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.wtitle { display: grid; gap: 2px; min-width: 0; } .wtitle b { font-family: var(--f-display); font-size: 1.2rem; }
.watch { display: grid; grid-template-columns: minmax(0, 460px) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .watch { grid-template-columns: minmax(0, 1fr); } }
.wboard { display: grid; gap: 10px; min-width: 0; } .wside { display: grid; gap: 14px; min-width: 0; }
.wctrl { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.ctl { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; cursor: pointer; min-height: 40px; }
.ctl.main { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-width: 84px; font-weight: 600; }
.ctl:hover:not(.main) { border-color: var(--accent); }
.speed { display: inline-flex; gap: 6px; align-items: center; font-size: .86rem; color: var(--muted); } .speed select { padding: 6px 8px; }
.wmoves { display: flex; flex-wrap: wrap; gap: 2px 4px; direction: ltr; font-family: var(--f-mono); font-size: .88rem; max-height: 9.5em; overflow-y: auto; padding: 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
.mnum { color: var(--muted); padding-inline: 2px 1px; }
.mvbtn { border: 0; background: transparent; border-radius: 5px; padding: 1px 5px; cursor: pointer; font: inherit; color: inherit; }
.mvbtn.on { background: var(--accent); color: var(--accent-ink); }
.ncard { gap: 10px; }
.ncard section { display: grid; gap: 3px; } .ncard h4 { margin: 0; font-size: .82rem; color: var(--accent); font-weight: 600; }
.ncard p { line-height: 1.75; }
.nhead { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; } .mv.big { font-size: 1.15rem; font-weight: 600; } .nhead .who { margin-inline-start: auto; }
.cls { font-size: .78rem; padding: 1px 10px; border-radius: 999px; color: #fff; }
.cls.excellent { background: var(--good); } .cls.good { background: color-mix(in srgb, var(--good) 70%, var(--muted)); } .cls.inaccuracy { background: var(--inacc); } .cls.mistake { background: var(--mistake); } .cls.blunder { background: var(--blunder); }
.cands { border-top: 1px dashed var(--line); padding-top: 6px; } .cand { display: grid; gap: 2px; padding-block: 4px; } .cand-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.habit { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; }
.opp { border-top: 1px dashed var(--line); padding-top: 6px; } .outro { background: var(--sunk); border-radius: 8px; padding: 10px 12px; }
.tag.plan { background: var(--arrow-plan); color: #fff; }
.mvref { font: 600 .9em var(--f-mono); direction: ltr; unicode-bidi: isolate; border: 1px solid var(--accent); color: var(--accent); background: var(--surface); border-radius: 6px; padding: 0 6px; cursor: pointer; margin-inline: 1px; }
.mvref:hover { background: var(--accent); color: var(--accent-ink); }
.branchbar { border: 2px solid var(--arrow-plan); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 8px; background: var(--surface); }
#b-line { display: flex; flex-wrap: wrap; gap: 2px 4px; direction: ltr; font-family: var(--f-mono); font-size: .9rem; }
.odds { display: grid; gap: 4px; }
.odds-bar { display: flex; height: 14px; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); direction: ltr; }
.odds-bar i { display: block; height: 100%; transition: width .35s ease; }
.odds-bar .ow { background: #f2f1ec; } .odds-bar .od { background: #9aa39e; } .odds-bar .ol { background: #2a2f2c; }
.odds-legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: .82rem; align-items: center; }
.odds-legend b { display: inline-block; width: 10px; height: 10px; border-radius: 3px; border: 1px solid var(--line); margin-inline-end: 4px; vertical-align: -1px; }
.odds-legend .sw { background: #f2f1ec; } .odds-legend .sd { background: #9aa39e; } .odds-legend .sl { background: #2a2f2c; }
.odds-delta { margin-inline-start: auto; font-weight: 600; } .odds-note { font-size: .76rem; }
/* ---------- chat ---------- */
.chat { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
.chat-h { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; } .chat-h b { font-family: var(--f-display); font-size: 1.05rem; }
.chat-log { display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
.msg { padding: 8px 12px; border-radius: 12px; max-width: 92%; line-height: 1.7; white-space: pre-wrap; }
.msg.me { background: var(--accent); color: var(--accent-ink); justify-self: start; }
.msg.coach { background: var(--sunk); justify-self: end; }
.chat-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip-q { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: .84rem; }
.chip-q:hover { border-color: var(--accent); }
.chat-form { display: flex; gap: 6px; } .chat-in { flex: 1; min-width: 0; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.mv.unv { text-decoration: underline wavy var(--blunder); }
.warnline { color: var(--blunder); }

/* ---------- play ---------- */
h4 { margin: 0; font-size: .95rem; font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: var(--surface); }
.seg label { position: relative; cursor: pointer; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; padding: 7px 16px; }
.seg input:checked + span { background: var(--accent); color: var(--accent-ink); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: -3px; }
.play { grid-template-areas: "board side" "below side"; }
.play .wboard { grid-area: board; } .play .wside { grid-area: side; } .play .wbelow { grid-area: below; min-width: 0; }
@media (max-width: 860px) { .play { grid-template-areas: "board" "side" "below"; } }
.coachfeed { gap: 8px; }
#p-feed { display: grid; gap: 8px; max-height: 560px; overflow-y: auto; align-content: start; }
@media (max-width: 860px) { #p-feed { max-height: 48vh; } }
.fcard { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: grid; gap: 6px; background: var(--surface); }
.fcard.mine { border-inline-start: 4px solid var(--accent); }
.fcard.theirs { border-inline-start: 4px solid var(--muted); background: var(--paper); }
.fcard.hint { border-inline-start: 4px solid var(--arrow-plan); }
.fcard.end { border-color: var(--accent); background: var(--accent-soft); }
.fcard:first-child { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 28%, transparent); }
.fcard p { line-height: 1.75; }
.fh { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; } .fh > .note { margin-inline-start: auto; }
.tag { font-size: .74rem; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink); }
.tag.best { background: var(--good); color: #fff; }
.livecheck { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: grid; gap: 6px; background: var(--surface); }
.livecheck .checklist { display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 0; list-style: none; }
.livecheck .checklist li { display: block; font-size: .82rem; padding: 2px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink); }
.livecheck .checklist li::marker { content: none; }
.livecheck .checklist li::before { content: "☐ "; } .livecheck .checklist li.ok::before { content: "✓ "; } .livecheck .checklist li.fail::before { content: "✗ "; }
.livecheck .checklist li.ok { background: color-mix(in srgb, var(--good) 18%, var(--surface)); color: var(--ink); }
.livecheck .checklist li.fail { background: color-mix(in srgb, var(--blunder) 16%, var(--surface)); color: var(--ink); }
.checklist.live { gap: 2px; }
.checklist.live li.ok::marker { content: "☑  "; } .checklist.live li.ok { color: var(--good); }
.checklist.live li.fail::marker { content: "☒  "; } .checklist.live li.fail { color: var(--blunder); }
.chip-q.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
/* ---------- review ---------- */
.sect { margin-block: 6px 0; }
.moments { display: grid; gap: 12px; }
.moment { gap: 10px; border-inline-start: 4px solid var(--blunder); }
.moment.good { border-inline-start-color: var(--good); } .moment.chance, .moment.slip { border-inline-start-color: var(--inacc); }
.mgrid { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 640px) { .mgrid { grid-template-columns: minmax(0, 1fr); } }
.mline { display: grid; gap: 8px; } .mtext { display: grid; gap: 8px; align-content: start; }
.mlbtns { display: flex; flex-wrap: wrap; gap: 6px; }
.mbadge { width: 26px; height: 26px; border-radius: 50%; background: var(--blunder); color: #fff; display: inline-grid; place-items: center; font: 600 .85rem var(--f-mono); }
.moment.good .mbadge { background: var(--good); } .moment.chance .mbadge, .moment.slip .mbadge { background: var(--inacc); }
.kpis.rk { grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); }
.wl { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
.lesson { background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; font-weight: 600; line-height: 1.8; }
svg .mk { stroke: var(--surface); stroke-width: 2; } svg .mk.error { fill: var(--blunder); } svg .mk.chance, svg .mk.slip { fill: var(--inacc); } svg .mk.good { fill: var(--good); }
svg text.mkt { fill: #fff; font-size: 10px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
svg .mk.back { fill: var(--surface); stroke-width: 2.5; } svg .mk.back.error { stroke: var(--blunder); } svg .mk.back.chance, svg .mk.back.slip { stroke: var(--inacc); }
svg text.mkt.back { fill: var(--ink); }
